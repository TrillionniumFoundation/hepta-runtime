config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  api_key: "file:/home/qian-qi/.config/hepta-chatgpt-tunnel/runtime-api-key"
health:
  listen_addr: "127.0.0.1:8792"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  server_urls:
    - channel: main
      url: "http://hepta-chatgpt.local/mcp"
      unix_socket: "/run/user/1000/hepta-chatgpt/bridge.sock"
  startup_wait_timeout: 30s
  max_concurrent_requests: 4
