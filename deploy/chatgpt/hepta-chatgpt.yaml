config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  api_key: "file:/home/qian-qi/.config/hepta-chatgpt-tunnel/runtime-api-key"
health:
  listen_addr: "127.0.0.1:8792"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "/usr/bin/python3 /home/qian-qi/.local/lib/hepta-chatgpt-bridge/bridge.py --stdio --upstream http://127.0.0.1:8790/mcp --token-file /home/qian-qi/.config/hepta-runtime-operator/token"
  startup_wait_timeout: 30s
  max_concurrent_requests: 4
