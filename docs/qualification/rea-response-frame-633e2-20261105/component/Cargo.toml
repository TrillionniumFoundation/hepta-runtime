[package]
name = "rea-frame-component-review"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
rmcp = { version = "=3.4.1", features = ["server", "macros", "transport-io"] }
