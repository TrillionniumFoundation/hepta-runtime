[package]
name = "rea-raw-transport-probe"
version = "0.1.0"
edition = "2021"
[dependencies]
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-io"] }
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
[profile.dev]
debug = 0
[profile.test]
debug = 0
