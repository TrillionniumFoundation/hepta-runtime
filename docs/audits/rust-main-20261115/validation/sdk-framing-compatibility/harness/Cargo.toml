[package]
name = "rea-transport-source-harness"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "signal", "io-std", "io-util", "net"] }
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "client"] }
