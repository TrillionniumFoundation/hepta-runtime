[package]
name = "hia-runtime-regex-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "=1.13.1"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-thompson", "unicode"] }

[[bin]]
name = "hia-runtime-regex-reference"
path = "oracle.rs"
