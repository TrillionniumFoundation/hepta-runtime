[package]
name = "hia-serde-error-reference"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "hia-serde-error-reference"
path = "main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
