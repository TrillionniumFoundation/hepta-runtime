name: HIA current eleven tool catalog
on:
  workflow_dispatch:
  push:
    branches:
      - 'hia-public-eleven-qualification-*'
permissions:
  contents: read
jobs:
  current-eleven:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public_eleven_catalog_ci/source
      - name: Checkout fixed HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Checkout independent current original
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/hepta-runtime
          path: original
          ref: d3d75c30719db966b004756f610007a7c723729e
          persist-credentials: false
      - name: Install fixed original compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Execute all original and native catalog domains
        run: |
          python3 -I -B runtime/tests/hia_native/public_eleven_catalog_ci/source/run_recipe.py \
            --phase all --hepta "$GITHUB_WORKSPACE/compiler" \
            --target "$GITHUB_WORKSPACE/original" --output "$RUNNER_TEMP/catalog-eleven"
      - name: Independently reread without writes or executions
        run: |
          printf 'owned foreign-read refusal fixture\n' > "$RUNNER_TEMP/catalog-eleven-foreign.txt"
          python3 -I -B runtime/tests/hia_native/public_eleven_catalog_ci/source/verify_readonly.py \
            --output "$RUNNER_TEMP/catalog-eleven" --foreign-path "$RUNNER_TEMP/catalog-eleven-foreign.txt" \
            > "$RUNNER_TEMP/catalog-eleven-readonly.json"
          cp "$RUNNER_TEMP/catalog-eleven-readonly.json" "$RUNNER_TEMP/catalog-eleven/readonly-verification.json"
      - name: Retain complete source, streams and failures
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/catalog-eleven"; then
            python3 -I -B runtime/tests/hia_native/public_eleven_catalog_ci/source/export_catalog.py \
              --input "$RUNNER_TEMP/catalog-eleven" --output "$RUNNER_TEMP/catalog-eleven-archive"
          fi
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-catalog-eleven-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-eleven-archive/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
