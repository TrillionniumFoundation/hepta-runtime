[package]
name = "hia-audit-write-reference"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hia-audit-write-reference"
path = "oracle.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
anyhow = "=1.0.104"
libc = "=0.2.189"
tracing = { version = "=0.1.44", features = ["std"] }
