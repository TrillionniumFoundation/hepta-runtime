[package]
name = "hia-audit-anchor-publish-reference"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hia-audit-anchor-publish-reference"
path = "main.rs"

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
ring = "=0.17.14"

[profile.dev]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
codegen-units = 256
lto = false
panic = "unwind"
