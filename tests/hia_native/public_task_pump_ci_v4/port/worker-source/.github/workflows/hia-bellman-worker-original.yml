name: HIA Bellman actual worker original observations

on:
  workflow_dispatch:
  push:
    branches:
      - hia-bellman-worker-original-6780-20261116

permissions:
  contents: read

jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the exact original toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Capture unchanged plan and actual blocking-worker observations
        run: |
          umask 077
          python -I -S -B tests/hia_native/blocking_worker_ci/capture_worker_reference.py \
            --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/bellman-worker-original"
      - name: Preserve the exact success or failure
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/bellman-worker-original" ]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/bellman-worker-original.tar.gz" bellman-worker-original
            sha256sum "$RUNNER_TEMP/bellman-worker-original.tar.gz" > "$RUNNER_TEMP/bellman-worker-original.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellman-worker-original-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bellman-worker-original.tar.gz
            ${{ runner.temp }}/bellman-worker-original.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
