[package]
name = "hepta-extract-lines-original-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "fs", "io-util", "sync"] }

[features]
remote-fs = []

[workspace]
