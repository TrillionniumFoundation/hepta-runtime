[package]
name = "scope-annotation-original"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scope-annotation-original"
path = "main.rs"

[dependencies]
anyhow = "=1.0.104"
rmcp = { version = "=3.9.0", default-features = false, features = ["server"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tracing = "=0.1.44"

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
rpath = false
