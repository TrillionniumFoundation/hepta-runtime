name: HIA configured catalog and actual default102
on:
  workflow_dispatch:
  push:
    branches:
      - 'hia-configured-catalog102-*'
permissions:
  contents: read
jobs:
  configured-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/configured_catalog102_ci
      - name: Checkout fixed HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Checkout independent current original
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/hepta-runtime
          path: original
          ref: d3d75c30719db966b004756f610007a7c723729e
          persist-credentials: false
      - name: Install fixed original compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check all source and preload fixed readers
        run: |
          python3 -I -B runtime/tests/hia_native/configured_catalog102_ci/ci/check_source.py
      - name: Fresh original SDK, complete HIA domains and actual installed102
        run: |
          python3 -I -B runtime/tests/hia_native/configured_catalog102_ci/ci/run_recipe.py \
            --phase all --hepta "$GITHUB_WORKSPACE/compiler" \
            --target "$GITHUB_WORKSPACE/original" --output /tmp/hccfg
      - name: Independently reread all sources and complete buffers without execution
        run: |
          python3 -I -B /tmp/hccfg/s/ci/independent_verify.py \
            --package /tmp/hccfg/s --capture /tmp/hccfg --output /tmp/hccfg-independent \
            --foreign-path /tmp/hccfg-foreign.txt
      - name: Retain complete source, streams and failures
        if: always()
        run: |
          if test -d /tmp/hccfg; then
            python3 -I -B runtime/tests/hia_native/configured_catalog102_ci/ci/export_evidence.py \
              --input /tmp/hccfg --output "$RUNNER_TEMP/configured-catalog-archive"
          fi
      - name: Upload complete bounded archive parts and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-configured-catalog-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/configured-catalog-archive/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
