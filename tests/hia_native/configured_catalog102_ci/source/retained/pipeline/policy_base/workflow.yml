name: HIA current complete catalog policy
on:
  workflow_dispatch:
  push:
    branches:
      - 'hia-catalog-policy-*'
permissions:
  contents: read
jobs:
  complete-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/catalog_policy_ci/source
      - name: Checkout fixed HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Checkout independent current original
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/hepta-runtime
          path: original
          ref: d3d75c30719db966b004756f610007a7c723729e
          persist-credentials: false
      - name: Install fixed original compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Execute complete native and fresh original domains
        run: |
          python3 -I -B runtime/tests/hia_native/catalog_policy_ci/source/run_recipe.py \
            --phase all --hepta "$GITHUB_WORKSPACE/compiler" \
            --target "$GITHUB_WORKSPACE/original" --output "$RUNNER_TEMP/catalog-policy"
      - name: Reopen complete original and native evidence
        run: |
          python3 -I -B runtime/tests/hia_native/catalog_policy_ci/source/run_recipe.py \
            --phase verify --output "$RUNNER_TEMP/catalog-policy"
      - name: Retain complete source, outputs and failures
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/catalog-policy"; then
            python3 -I -B runtime/tests/hia_native/catalog_policy_ci/source/export_catalog.py \
              --input "$RUNNER_TEMP/catalog-policy" --output "$RUNNER_TEMP/catalog-policy-archive"
          fi
      - name: Upload complete compressed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-catalog-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-policy-archive/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
