[package]
name="hia-runtime-config-reference"
version="0.1.0"
edition="2021"
publish=false
[dependencies]
tracing="=0.1.44"
serde={version="=1.0.229",features=["derive"]}
serde_json={version="=1.0.151",features=["float_roundtrip","raw_value"]}
rmcp={version="=3.4.1",default-features=false,features=["server","transport-io"]}
schemars={version="=1.2.2",features=["chrono04"]}
anyhow="=1.0.104"
regex="=1.13.1"
ring="=0.17.14"
sha2="=0.11.0"
libc="=0.2.189"
tokio={version="=1.53.1",features=["rt","time","io-std"]}



[[bin]]
name="hia-binary32-reference"
path="binary32.rs"

[[bin]]
name="hia-typed-json-reference"
path="typed_result.rs"

[[bin]]
name="hia-request-result-reference"
path="request_result.rs"
