[package]
name = "g5-target-text-editor-catalog-oracle"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "g5-target-text-editor-catalog-oracle"
path = "main.rs"

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }

[workspace]
