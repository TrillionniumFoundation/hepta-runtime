[package]
name = "g2-target-connection-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "g2-target-connection-oracle"
path = "main.rs"

[dependencies]
anyhow = "=1.0.104"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "io-util", "macros"] }

[workspace]
