[package]
name = "hepta-text-editor-gateway-local-original-oracle"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = "=1.0.104"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "fs", "io-util", "macros", "sync"] }
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }
futures = "=0.3.34"
schemars = "=1.2.2"
libc = "=0.2.189"
sha2 = "=0.11.0"
tracing = "=0.1.44"

[features]
remote-fs = []

[workspace]
