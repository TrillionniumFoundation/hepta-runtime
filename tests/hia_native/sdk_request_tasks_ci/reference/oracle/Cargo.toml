[package]
name = "current-sdk-request-task-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "current-sdk-request-task-oracle"
path = "main.rs"

[dependencies]
anyhow = "=1.0.104"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "time", "io-util", "macros", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[workspace]
