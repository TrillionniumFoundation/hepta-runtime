[package]
name="hia-public-eligible-original"
version="0.1.0"
edition="2021"
publish=false
[[bin]]
name="hia-public-eligible-original"
path="mcp/oracle_mcp.rs"
[dependencies]
anyhow={default-features=true,features=[],version="=1.0.104"}
axum={default-features=false,features=["http1","tokio"],version="=0.8.9"}
block-buffer={default-features=true,features=["zeroize"],version="=0.12.1"}
crypto-common={default-features=true,features=["getrandom"],version="=0.2.2"}
ctutils={default-features=true,features=["subtle"],version="=0.4.2"}
digest={default-features=true,features=["mac"],version="=0.11.3"}
getrandom={default-features=true,features=["sys_rng","wasm_js"],version="=0.4.3"}
hybrid-array={default-features=true,features=["ctutils","subtle","zeroize"],version="=0.4.15"}
libc={default-features=true,features=[],version="=0.2.189"}
regex={default-features=true,features=[],version="=1.13.1"}
ring={default-features=true,features=[],version="=0.17.14"}
rmcp={default-features=true,features=["server","transport-io","transport-streamable-http-server"],version="=3.4.1"}
schemars={default-features=true,features=["chrono04"],version="=1.2.2"}
serde={default-features=true,features=["derive"],version="=1.0.229"}
serde_json={default-features=true,features=["float_roundtrip","raw_value"],version="=1.0.151"}
sha2={default-features=true,features=[],version="=0.11.0"}
subtle={version="=2.6.1"}
tokio={default-features=true,features=["io-std","io-util","macros","rt","time"],version="=1.53.1"}
tower={features=["util"],version="=0.5.3"}
tracing={default-features=true,features=["std"],version="=0.1.44"}
zeroize={version="=1.9.0"}
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel={default-features=true,features=["sink"],version="=0.3.34"}
futures-util={default-features=true,features=["channel","io","sink"],version="=0.3.34"}
js-sys={default-features=false,features=["std"],version="=0.3.106"}
