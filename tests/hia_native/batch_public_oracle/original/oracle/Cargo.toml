[package]
name = "hepta-batch-call-original"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.189"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-async-rw"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "=0.1.44"

[workspace]
