[package]
name = "hia-audit-legacy-reference"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hia-audit-legacy-reference"
path = "oracle.rs"

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.189"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.11.0"
