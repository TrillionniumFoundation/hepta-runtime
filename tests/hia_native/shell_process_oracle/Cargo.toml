[package]
name = "hepta-shell-process-original-oracle"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[dependencies]
anyhow = { version = "1.0.104", features = ["default", "std"] }
regex = { version = "1.13.1", features = ["default", "perf", "perf-backtrack", "perf-cache", "perf-dfa", "perf-inline", "perf-literal", "perf-onepass", "std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
serde = { version = "1.0.229", features = ["alloc", "default", "derive", "rc", "serde_derive", "std"] }
serde_json = { version = "1.0.151", features = ["alloc", "default", "float_roundtrip", "raw_value", "std"] }
tokio = { version = "1.53.1", features = ["bytes", "default", "fs", "io-std", "io-util", "libc", "macros", "mio", "net", "process", "rt", "rt-multi-thread", "signal", "signal-hook-registry", "socket2", "sync", "time", "tokio-macros", "windows-sys"] }
libc = { version = "0.2", features = ["default", "extra_traits", "std"] }
aho-corasick = { version = "=1.1.5", features = ["default", "perf-literal", "std"], default-features = false }
futures-core = { version = "=0.3.34", features = ["alloc", "default", "std"], default-features = false }
futures-sink = { version = "=0.3.34", features = ["alloc", "default", "std"], default-features = false }
once_cell = { version = "=1.21.4", features = ["alloc", "default", "race", "std"], default-features = false }
regex-automata = { version = "=0.4.18", features = ["alloc", "dfa-onepass", "hybrid", "meta", "nfa", "nfa-backtrack", "nfa-pikevm", "nfa-thompson", "perf", "perf-inline", "perf-literal", "perf-literal-multisubstring", "perf-literal-substring", "std", "syntax", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "unicode-word-boundary"], default-features = false }
serde_core = { version = "=1.0.229", features = ["alloc", "default", "rc", "result", "std"], default-features = false }
syn = { version = "=3.0.6", features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"], default-features = false }
wasm-bindgen = { version = "=0.2.129", features = ["default", "std"], default-features = false }
windows-sys = { version = "=0.61.2", features = ["Wdk", "Wdk_Foundation", "Wdk_Storage", "Wdk_Storage_FileSystem", "Wdk_System", "Wdk_System_IO", "Win32", "Win32_Foundation", "Win32_Networking", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System", "Win32_System_Console", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "default"], default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
bitflags = { version = "=2.13.2", features = ["serde", "serde_core", "std"] }
getrandom = { version = "=0.4.3", features = ["std", "sys_rng", "wasm_js"] }
futures-util = { version = "=0.3.34", features = ["alloc", "async-await", "async-await-macro", "channel", "default", "futures-channel", "futures-io", "futures-macro", "futures-sink", "io", "memchr", "sink", "slab", "std"] }
js-sys = { version = "=0.3.106", features = ["default", "std", "unsafe-eval"] }
futures-channel = { version = "=0.3.34", features = ["alloc", "default", "futures-sink", "sink", "std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
rpath = false
