[package]
name = "hepta-smallhcsn-trace-research"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[[bin]]
name = "hepta-smallhcsn-late-program"
path = "src/late_program.rs"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.11.0"
libc = "=0.2.186"

[profile.release]
opt-level = 3

