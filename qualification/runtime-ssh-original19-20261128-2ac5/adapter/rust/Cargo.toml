[package]
name = "hia-ssh-original19-native-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = { version = "=1.0.104", features = ["default", "std"] }
libc = { version = "=0.2.189", features = ["default", "extra_traits", "std"] }
serde = { version = "=1.0.229", features = ["alloc", "default", "derive", "rc", "serde_derive", "std"] }
serde_json = { version = "=1.0.151", features = ["alloc", "default", "float_roundtrip", "raw_value", "std"] }
tempfile = { version = "=3.27.0", features = ["default", "getrandom"] }
tokio = { version = "=1.53.3", features = ["bytes", "default", "fs", "io-std", "io-util", "libc", "macros", "mio", "net", "process", "rt", "rt-multi-thread", "signal", "signal-hook-registry", "socket2", "sync", "time", "tokio-macros"] }
tokio-util = { version = "=0.7.19", features = ["codec", "default", "futures-util", "libc", "rt"] }

[profile.release]
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Reduce parallel code generation units for better optimization
panic = "abort"         # Abort on panic for smaller binary size
strip = true            # Strip symbols from binary
opt-level = 3           # Prioritize runtime throughput and bounded cold-validation latency
overflow-checks = false # Disable overflow checks in release mode

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
rpath = false
