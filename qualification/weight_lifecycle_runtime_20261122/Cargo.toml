[package]
name = "hepta-weight-lifecycle-study"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
libc = "0.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time"] }
hepta-runtime = { path = "../..", default-features = false }
hepta-semantic-source-adapter-study = { path = "../weight_semantic_adapter_20261120" }
hepta-continuation-runtime-study = { path = "../weight_continuation_runtime_20261121" }
hepta-full-native-study = { path = "../weight_full_native_20261121" }
hepta-weight-program-study = { path = "../weight_program_runtime_20261122" }
hepta-weight-recovery-study = { path = "../weight_recovery_runtime_20261122" }

[features]
default = []
remote-fs = ["hepta-runtime/remote-fs"]

[profile.dev]
debug = 0
opt-level = 1
overflow-checks = true

[patch.crates-io]
ruzstd = { path = "../../vendor/ruzstd" }
