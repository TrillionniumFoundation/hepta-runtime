name: Operator parity qualification
on:
  push:
    branches: [feat/operator-parity-20261006]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check and retain exact source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git archive --format=tar.gz HEAD > /tmp/hepta-runtime-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: operator-source-${{ github.sha }}
          path: /tmp/hepta-runtime-source.tar.gz
          retention-days: 7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Install and verify native PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          test -x /usr/bin/pdftoppm
          /usr/bin/pdftoppm -v
      - name: Install native document test worker
        run: |
          python3 -m venv /tmp/hepta-document-worker
          /tmp/hepta-document-worker/bin/pip install -r deploy/requirements-documents.txt
      - name: Format, strict lint and local regression
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            cargo clippy --locked --all-features --all-targets -- -D warnings
            cargo test --locked --all-targets
            python3 tests/process_ops_tests.py
            python3 tests/supervisor_tests.py
            python3 tests/file_capabilities.py
            python3 tests/binary_file_tests.py
            python3 tests/output_capture_tests.py
            python3 tests/terminal_host_tests.py
            /tmp/hepta-document-worker/bin/python tests/document_local_tests.py
            /tmp/hepta-document-worker/bin/python tests/document_extended_tests.py
          } 2>&1 | tee /tmp/operator-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-tests-${{ github.sha }}
          path: /tmp/operator-tests.log
          if-no-files-found: ignore
          retention-days: 14
