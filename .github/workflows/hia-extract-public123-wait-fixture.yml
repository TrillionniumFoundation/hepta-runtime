name: Shared123 actual extract WAIT private carrier
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-public-6780-20261116']
    paths: ['tests/hia_native/public123_extract_wait_fixture_ci/**', '.github/workflows/hia-extract-public123-wait-fixture.yml']
permissions:
  contents: read
  actions: read
env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set fixed package and evidence paths
        run: |
          printf '%s\n' "WAIT_PACKAGE=$GITHUB_WORKSPACE/runtime/tests/hia_native/public123_extract_wait_fixture_ci" "WAIT_CAPTURE=$RUNNER_TEMP/shared123-wait-fixture" "WAIT_RETAINED=$RUNNER_TEMP/shared123-wait-retained" "WAIT_EXPORT=$RUNNER_TEMP/shared123-wait-export" "WAIT_DRIVER=$RUNNER_TEMP/shared123-wait-driver" >> "$GITHUB_ENV"
      - name: Checkout exact source package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public123_extract_wait_fixture_ci
      - name: Checkout exact Hepta compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source and syntax
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse HEAD)" = '${{ github.sha }}'
          test "$(sha256sum "$WAIT_PACKAGE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = 'c33e4bd9bb613c4e0211485bc15c778a8ccc4d1ed746f11ffb1af3d2dc7e8f09'
          python3 -I -S -B "$WAIT_PACKAGE/check_source.py"
      - name: Read complete shared123 and build only the added test carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -I -S -B "$WAIT_PACKAGE/build_fixture.py" --output "$WAIT_CAPTURE" --retained "$WAIT_RETAINED" --hepta "$GITHUB_WORKSPACE/compiler" > "$WAIT_DRIVER.stdout" 2> "$WAIT_DRIVER.stderr"
          wait_status=$?
          cat "$WAIT_DRIVER.stderr"
          test "$wait_status" -ne 0 || cat "$WAIT_DRIVER.stdout"
          exit "$wait_status"
      - name: Four physical refusals and complete relocation under read-only guards
        run: |
          python3 -I -S -B "$WAIT_PACKAGE/controls.py" --retained "$WAIT_RETAINED/retained" --fixture "$WAIT_CAPTURE" --output "$WAIT_CAPTURE-reader-controls"
      - name: Preserve full fixed carrier and proof success or failure
        if: always()
        run: |
          python3 -I -S -B "$WAIT_PACKAGE/archive.py" pack --source "$WAIT_PACKAGE" --capture "$WAIT_CAPTURE" --output "$WAIT_EXPORT" --driver-prefix "$WAIT_DRIVER"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared123-wait-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.WAIT_EXPORT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
