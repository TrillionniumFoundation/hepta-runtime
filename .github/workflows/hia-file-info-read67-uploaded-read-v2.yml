name: Independently read all qualified info read67 captures
on:
  workflow_dispatch:
  push:
    branches: [hia-info-read67-uploaded-read-6780-20261118]
permissions:
  contents: read
  actions: read
jobs:
  read:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [ordinary, errors, outer-orphans, descriptor, mutation, observer-off, child-orphans, shm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      INFO_SOURCE: ${{ github.workspace }}/runtime/qualification/file_info_at/v2/uploaded_read
      INFO_MANIFEST: 75f9721009c46a4aca29c812df7c7dc44353b289cc2283caf741c2c1c4cc4996
      INFO_GROUP: ${{ matrix.group }}
    steps:
      - name: Checkout frozen pure readers and both complete qualification sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/file_info_at/v2/uploaded_read
          persist-credentials: false
      - name: Fully read uploaded archives and original qualification evidence
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -S -B "$INFO_SOURCE/scripts/driver.py" read \
            --work "$RUNNER_TEMP/info-independent-$INFO_GROUP" --group "$INFO_GROUP" --source-manifest-sha256 "$INFO_MANIFEST"
      - name: Retain complete independent read proof and any initial failure
        if: always()
        run: |
          python3 -I -S -B "$INFO_SOURCE/scripts/driver.py" export \
            --work "$RUNNER_TEMP/info-independent-$INFO_GROUP" --group "$INFO_GROUP" --source-manifest-sha256 "$INFO_MANIFEST" \
            --output "$RUNNER_TEMP/info-independent-$INFO_GROUP-export"
      - name: Upload full independent read evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: info-read67-independent-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/info-independent-${{ matrix.group }}-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
