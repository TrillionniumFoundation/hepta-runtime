name: Export complete v23 original state failure bytes
on:
  push:
    branches: [hia-original-state-export-6780-20261116]
    paths: ['.github/workflows/hia-original-state-evidence-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover the exact existing original artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14214519491 > "$RUNNER_TEMP/original-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14214519491/zip > "$RUNNER_TEMP/original-artifact.zip"
      - name: Verify and split all original bytes without semantic execution
        run: |
          python3 -I -S -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'original-artifact.zip'
          metadata=json.loads((root/'original-artifact.json').read_bytes())
          digest='097b4b530c9082f1ce04142ec7168e1bf9d0d3422c6757659e8af2a7e15cd038'
          assert metadata['id']==14214519491 and metadata['workflow_run']['id']==43838754943
          assert metadata['workflow_run']['head_sha']=='91d754f7366560496d0c72415c67af4093454935'
          assert metadata['size_in_bytes']==archive.stat().st_size==770426923
          assert metadata['digest']=='sha256:'+digest and metadata['expired'] is False
          with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
          destination=root/'complete-parts';destination.mkdir();parts=[];offset=0
          with archive.open('rb') as source:
              for index in range(3):
                  raw=source.read(256<<20);assert raw
                  folder=destination/str(index);folder.mkdir();(folder/'part.bin').write_bytes(raw)
                  parts.append(dict(index=index,offset=offset,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()));offset+=len(raw)
              assert source.read(1)==b'' and offset==770426923
          record=dict(schema='hepta.complete-original-artifact-zip-parts.v1',original_run=43838754943,
              original_job=133224091424,original_artifact=14214519491,
              original_head='91d754f7366560496d0c72415c67af4093454935',
              original_zip=dict(bytes=770426923,sha256=digest),parts=parts,
              semantic_executions=0,original_failure_reclassified_as_pass=False,source_or_evidence_modified=False)
          for row in parts:
              folder=destination/str(row['index'])
              (folder/'parts.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
              shutil.copyfile(root/'original-artifact.json',folder/'original-artifact.json')
          print(json.dumps(record,sort_keys=True))
          PY
      - name: Retain first complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-original-state-complete-part-0
          path: ${{ runner.temp }}/complete-parts/0/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain second complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-original-state-complete-part-1
          path: ${{ runner.temp }}/complete-parts/1/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain final complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-original-state-complete-part-2
          path: ${{ runner.temp }}/complete-parts/2/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
