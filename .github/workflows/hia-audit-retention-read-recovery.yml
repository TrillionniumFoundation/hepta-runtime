name: Inert recovery of completed HIA audit retention evidence
on:
  workflow_dispatch:
  push:
    branches: [hia-audit-retention-reader-recovery-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  retention-read-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      RECOVERY_SOURCE: ${{ github.workspace }}/runtime/tests/hia_native/audit_retention_read_recovery
      RECOVERY_SHA: 44ef9d5c8f9d480fa635dfaf86f35d4089a1ffce12007e87712ebaea573137ad
    steps:
      - name: Checkout frozen adapter and unchanged producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: |
            tests/hia_native/audit_retention
            tests/hia_native/audit_retention_read_recovery
          persist-credentials: false
      - name: Verify exact frozen source before reading evidence
        run: |
          printf 'RECOVERY_OUTPUT=%s\n' "$RUNNER_TEMP/audit-retention-recovery" >> "$GITHUB_ENV"
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B - <<'PY'
          import os,sys
          from pathlib import Path
          root=Path(os.environ['RECOVERY_SOURCE'])
          sys.path.insert(0,str(root))
          import repair
          assert repair.identity()==os.environ['RECOVERY_SHA']
          for path in root.glob('*.py'):compile(path.read_bytes(),str(path),'exec')
          PY
      - name: Restore every original archive byte and mode within 180 seconds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B "$RECOVERY_SOURCE/bounded_stage.py" restore --destination "$RECOVERY_OUTPUT" --source-manifest-sha256 "$RECOVERY_SHA"
      - name: Read completed producer under the unchanged inert guard
        run: python3 -I -B "$RECOVERY_SOURCE/run_ci.py" read --destination "$RECOVERY_OUTPUT" --source-manifest-sha256 "$RECOVERY_SHA"
      - name: Exercise twelve physical refusals and four complete admissions
        run: python3 -I -B "$RECOVERY_SOURCE/run_ci.py" controls --destination "$RECOVERY_OUTPUT" --source-manifest-sha256 "$RECOVERY_SHA"
      - name: Independently read complete producer and physical controls
        run: python3 -I -B "$RECOVERY_SOURCE/run_ci.py" independent --destination "$RECOVERY_OUTPUT" --source-manifest-sha256 "$RECOVERY_SHA"
      - name: Preserve complete success or failure evidence within 180 seconds
        if: always()
        run: |
          mkdir -p "$RECOVERY_OUTPUT"
          python3 -I -B "$RECOVERY_SOURCE/bounded_stage.py" export --destination "$RECOVERY_OUTPUT" --source-manifest-sha256 "$RECOVERY_SHA"
      - name: Upload all source and physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-retention-read-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/audit-retention-recovery.tar.gz
            ${{ runner.temp }}/audit-retention-recovery.tar.gz.json
            ${{ runner.temp }}/audit-retention-recovery-stage-processes
          if-no-files-found: error
          retention-days: 14
