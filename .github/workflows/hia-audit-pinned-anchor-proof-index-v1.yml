name: Audit pinned anchor uploaded proof pins
on:
  push:
    branches: [hia-audit-pinned-anchor-proof-index-v1-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Freeze and admit exact pure metadata reader
        run: |
          mkdir "$RUNNER_TEMP/anchor-proof-index"
          cp tests/hia_native/audit_pinned_anchor_proof_index_v1/read_proof.py "$RUNNER_TEMP/anchor-proof-index/read_proof.py"
          printf '662ba5b4f3925251e33e35ac3e285a2de651123981839ca1a520c68d04d8bc0e  %s\n' "$RUNNER_TEMP/anchor-proof-index/read_proof.py" | sha256sum -c -
      - name: Retrieve exact independent proof upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14325242433/zip > "$RUNNER_TEMP/anchor-proof-index/uploaded.zip"
      - name: Read all uploaded proof bytes and admitted runtime pins
        run: |
          timeout --signal=KILL 60 python3 -I -B "$RUNNER_TEMP/anchor-proof-index/read_proof.py" --archive "$RUNNER_TEMP/anchor-proof-index/uploaded.zip" --output "$RUNNER_TEMP/anchor-proof-index/RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-pinned-anchor-proof-index-v1
          path: |
            ${{ runner.temp }}/anchor-proof-index/read_proof.py
            ${{ runner.temp }}/anchor-proof-index/RESULT.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 30
