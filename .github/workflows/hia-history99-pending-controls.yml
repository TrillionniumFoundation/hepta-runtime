name: Main99 unchanged pending evidence controls
on:
  push:
    branches: [hia-history99-pending-controls-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  controls:
    name: Complete ${{ matrix.kind }} retained controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [filesystem, regex]
    steps:
      - name: Checkout frozen continuation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: reader
          persist-credentials: false
          sparse-checkout: qualification/history99/controls-v1
      - name: Checkout exact original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: 99d107c062a6eb3f226dd82b05283aeecbd3c495
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            authoring
            runtime_support
            src
            vendor
            tests/hia_native
            tests/oracles
            .github
      - name: Admit all frozen source bytes
        env:
          KIND: ${{ matrix.kind }}
        run: |
          printf 'PROOF=%s/history-%s-proof\n' "$RUNNER_TEMP" "$KIND" >> "$GITHUB_ENV"
          printf 'PACKAGE=%s/reader/qualification/history99/controls-v1\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/history-$KIND-proof/logs"
          timeout --signal=KILL 60s python3 -I -S -B - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('reader/qualification/history99/controls-v1')
          raw=(root/'SOURCE_MANIFEST.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='e3529089f07568839f4a9867d7dc84a7d4dac156140d11682b8b39798a1bfe15'
          files=json.loads(raw)['files']
          assert {p.name for p in root.iterdir()}==set(files)|{'SOURCE_MANIFEST.json'}
          for name,row in files.items():
              body=(root/name).read_bytes()
              assert len(body)==row['bytes'] and hashlib.sha256(body).hexdigest()==row['sha256']
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==row['git_blob']
              if name.endswith('.py'):compile(body,str(root/name),'exec')
          reuse=json.loads((root/'REUSE.json').read_bytes())
          assert all(files[name]==row for name,row in reuse['unchanged_sources'].items())
          print('ALL_FROZEN_SOURCES_AND_UNCHANGED_CONTROL_HELPERS_PASS')
          PY
      - name: Materialize exact original historical source
        run: |
          test "$(git -C runtime rev-parse HEAD)" = 99d107c062a6eb3f226dd82b05283aeecbd3c495
          timeout --signal=KILL 180s python3 -I -B runtime/tests/hia_native/historical_public58/materialize.py --source "$GITHUB_WORKSPACE/runtime" --output "$RUNNER_TEMP/hia-historical-public58" > "$PROOF/logs/materialize.stdout" 2> "$PROOF/logs/materialize.stderr"
      - name: Download immutable original failure and complete input indices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14308317195 > "$PROOF/ORIGINAL_API.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14308317195/zip > "$RUNNER_TEMP/history99-failure.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14309198930 > "$PROOF/INDEX_API.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14309198930/zip > "$RUNNER_TEMP/history99-index.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14309294507 > "$PROOF/INSPECTION_API.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14309294507/zip > "$RUNNER_TEMP/history99-inspection.zip"
      - name: Read every original ZIP TAR byte and restore complete sealed inputs
        env:
          KIND: ${{ matrix.kind }}
        run: |
          timeout --signal=KILL 900s python3 -I -S -B "$PACKAGE/prepare.py" --kind "$KIND" --zip "$RUNNER_TEMP/history99-failure.zip" --metadata "$PROOF/ORIGINAL_API.json" --index "$RUNNER_TEMP/history99-index.zip" --inspection "$RUNNER_TEMP/history99-inspection.zip" --output "$PROOF/preparation" > "$PROOF/logs/preparation.stdout" 2> "$PROOF/logs/preparation.stderr"
      - name: Prepare the recorded Python interpreter only
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: -r "$RUNNER_TEMP/hia-historical-public58/tests/hia_native/python-reference-requirements.txt"
      - name: Execute complete retained controls with unchanged 180 second child deadline
        env:
          KIND: ${{ matrix.kind }}
        run: |
          timeout --signal=KILL 900s "$RUNNER_TEMP/hia-native-python/bin/python3" -I -B "$PACKAGE/run_$KIND.py" --preparation "$PROOF/preparation/PREPARATION.json" --output "$PROOF/run" > "$PROOF/logs/control.stdout" 2> "$PROOF/logs/control.stderr"
      - name: Preserve complete terminal diagnostics
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: |
          for path in "$PROOF"/logs/*.stdout "$PROOF"/logs/*.stderr "$PROOF"/run/"$KIND".process.json "$PROOF"/run/"$KIND".audit.json "$PROOF"/run/"$KIND".stderr; do
            if test -f "$path"; then cat "$path"; fi
          done
      - name: Archive complete source inputs controls and all failure bytes
        id: archive
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: |
          timeout --signal=KILL 900s python3 -I -S -B "$PACKAGE/export.py" --kind "$KIND" --proof "$PROOF" --package "$PACKAGE" --output "$RUNNER_TEMP/history-$KIND-export"
      - name: Retain full continuation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history99-${{ matrix.kind }}-continuation-${{ github.sha }}
          path: ${{ runner.temp }}/history-${{ matrix.kind }}-export/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain all partial bytes if archival failed
        if: always() && steps.archive.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history99-${{ matrix.kind }}-partial-${{ github.sha }}
          path: |
            ${{ runner.temp }}/history-${{ matrix.kind }}-proof/
            ${{ runner.temp }}/hia-historical-public58/
            ${{ runner.temp }}/hia-runtime-native/
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
