name: Temporary retained Text trace diagnostic

on:
  push:
    paths:
      - '.github/workflows/text-trace-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  retained-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read the exact failed archive without executing retained code
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, re, tarfile, urllib.error, urllib.parse, urllib.request, zipfile
          base = Path(os.environ['RUNNER_TEMP_DIR']) / 'text-trace-diagnostic'
          base.mkdir()
          def pin(raw):
              return {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          def save(path, obj):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, sort_keys=True, indent=2) + '\n')
          request = urllib.request.Request(
              'https://api.github.com/repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14183122554/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          archive = base.parent / 'text-failed-14183122554.zip'
          digest = hashlib.sha256()
          length = 0
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=60)
              raise AssertionError('expected GitHub artifact redirect')
          except urllib.error.HTTPError as error:
              assert error.code == 302
              location = error.headers['Location']
              assert urllib.parse.urlsplit(location).scheme == 'https'
          # The short-lived object-store URL is read without the GitHub credential.
          with urllib.request.urlopen(location, timeout=60) as response, archive.open('xb') as out:
              while True:
                  raw = response.read(1 << 20)
                  if not raw:
                      break
                  digest.update(raw)
                  length += len(raw)
                  out.write(raw)
          assert length == 628999797
          assert digest.hexdigest() == '1391267006289760ad97e9314e79c953ec4fb5dc15d024a11295a93650e96b7f'
          receipt = {'artifact_id': 14183122554, 'run_id': 43765626814,
                     'failed_job_id': 132974446438, 'archive': {'bytes': length, 'sha256': digest.hexdigest()},
                     'diagnostic_only': True, 'qualification_admitted': False,
                     'tar_members': [], 'selected': {}, 'unmatched_trace_lines': []}
          with zipfile.ZipFile(archive) as package:
              receipt['zip_members'] = [{'name': i.filename, 'bytes': i.file_size, 'crc': i.CRC}
                                        for i in package.infolist()]
              for item in package.infolist():
                  if item.is_dir():
                      continue
                  if item.filename.endswith('.tar'):
                      with package.open(item) as stream, tarfile.open(fileobj=stream, mode='r|') as tar:
                          for member in tar:
                              name = member.name.removeprefix('./')
                              parts = PurePosixPath(name).parts
                              receipt['tar_members'].append({'name': member.name, 'bytes': member.size,
                                                             'type_hex': member.type.hex()})
                              assert not name.startswith('/') and '..' not in parts
                              chosen = (member.isfile() and 'text-publication-original' in parts
                                        and not {'target', 'fixtures', 'tool-binaries'}.intersection(parts)
                                        and (name.endswith(('.json', '.jsonl', 'strace.log'))
                                             or PurePosixPath(name).name in ('stdout', 'stderr')))
                              if not chosen:
                                  continue
                              raw = tar.extractfile(member).read()
                              assert len(raw) == member.size
                              destination = base / 'retained' / name
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              destination.write_bytes(raw)
                              receipt['selected'][name] = pin(raw)
                              if name.endswith('strace.log'):
                                  lines = raw.split(b'\n')
                                  for line_number, line in enumerate(lines, 1):
                                      if not line and line_number == len(lines):
                                          continue
                                      if re.fullmatch(rb'(\d+) (\d+\.\d+) (.*)', line) is None:
                                          receipt['unmatched_trace_lines'].append({
                                              'path': name, 'line': line_number, 'bytes_hex': line.hex(),
                                              'text': line.decode('ascii', 'backslashreplace')})
                  elif item.file_size <= 16 << 20:
                      raw = package.read(item)
                      name = PurePosixPath(item.filename)
                      assert not name.is_absolute() and '..' not in name.parts
                      destination = base / 'package-metadata' / name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(raw)
                      receipt['selected']['zip:' + item.filename] = pin(raw)
          save(base / 'RECEIPT.json', receipt)
          assert receipt['unmatched_trace_lines'], 'retain actual parser counterexample'
          print(json.dumps({'selected_files': len(receipt['selected']),
                            'unmatched_trace_lines': receipt['unmatched_trace_lines'][:8]}, sort_keys=True))
          PY
      - name: Preserve exact selected trace and archive metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: text-trace-8f5-retained-diagnostic
          path: ${{ runner.temp }}/text-trace-diagnostic/
          if-no-files-found: error
          retention-days: 7
