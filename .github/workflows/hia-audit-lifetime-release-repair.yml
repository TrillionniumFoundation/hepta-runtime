name: Author exact HIA cohort release completion
on:
  workflow_dispatch:
  push:
    branches: [hia-audit-lifetime-release-repair-6780-20261117]
permissions:
  contents: read
jobs:
  author-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: tests/hia_native/audit_lifetime
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Author the fixed controller and byte-identical callable boundary
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
          python3 -I -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys
          workspace=Path(os.environ['GITHUB_WORKSPACE'])
          source=workspace/'runtime/tests/hia_native/audit_lifetime'
          temporary=Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(source))
          from process import Recorder
          checkpoint=json.loads((source/'CALLABLE_CHECKPOINT.json').read_bytes())
          for name,expected in checkpoint['files'].items():
              raw=(source/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==expected,name
          records=Recorder(source,temporary/'audit-lifetime-release-author-outer')
          try:
              for label,script in [('controller','author_lifetime.py'),('callable','author_lifetime_callable.py')]:
                  records.run('author-'+label,[sys.executable,'-I','-B',source/'authoring'/script,
                      '--root',source,'--hepta',workspace/'compiler','--output',temporary/('audit-lifetime-release-'+label+'-output')],timeout=60)
          finally:
              for path in sorted(records.directory.glob('*.stderr')):
                  print('AUTHOR_STDERR '+path.name)
                  print(path.read_text(),end='')
              print((records.directory/'processes.json').read_text(),end='')
          manifest={}
          for name in ['native/audit_lifetime.hepta','native/audit_lifetime.composition.json',
                       'native/audit_refs_emitter.hepta','native/audit_lifetime_callable.hepta',
                       'native/audit_lifetime_callable.composition.json','reference/registry.rs.txt']:
              raw=(source/name).read_bytes()
              manifest[name]=dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),git_blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest())
              print('FINAL_GENERATED_BEGIN '+name)
              print(raw.decode(),end='')
              print('FINAL_GENERATED_END '+name)
          print('FINAL_GENERATED_MANIFEST '+json.dumps(manifest,sort_keys=True))
          print(json.dumps(dict(native_or_hia_execution=0,rust_build_or_execution=0),sort_keys=True))
          PY
      - name: Preserve complete source authoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-lifetime-release-source-${{ github.sha }}
          path: |
            ${{ github.workspace }}/runtime/tests/hia_native/audit_lifetime
            ${{ runner.temp }}/audit-lifetime-release-author-outer
            ${{ runner.temp }}/audit-lifetime-release-controller-output
            ${{ runner.temp }}/audit-lifetime-release-callable-output
          if-no-files-found: error
          retention-days: 14
