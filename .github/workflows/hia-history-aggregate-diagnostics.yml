name: Inspect complete V6 history recovery proof without replay
on:
  push:
    branches: [hia-history-aggregate-diagnostics-6780-20261116]
    paths: ['.github/workflows/hia-history-aggregate-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: observer
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/history_aggregate_recovery/diagnostics-v2
      - name: Download only the exact failed V6 recovery proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14290847466 > "$RUNNER_TEMP/recovery-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14290847466/zip > "$RUNNER_TEMP/recovery-artifact.zip"
      - name: Fully read all ZIP TAR source and member bytes and print the rejection
        run: |
          timeout --signal=KILL 900 python3 -I -S -B \
            observer/qualification/history_aggregate_recovery/diagnostics-v2/inspect_recovery.py \
            --zip "$RUNNER_TEMP/recovery-artifact.zip" \
            --metadata "$RUNNER_TEMP/recovery-artifact.json" \
            --output "$RUNNER_TEMP/history-recovery-diagnostics"
      - name: Preserve every readback proof and observer source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-recovery-v6-complete-diagnostics
          path: |
            ${{ runner.temp }}/history-recovery-diagnostics/
            ${{ runner.temp }}/recovery-artifact.json
            observer/qualification/history_aggregate_recovery/diagnostics-v2/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
