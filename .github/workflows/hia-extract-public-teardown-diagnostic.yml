name: Observe actual public118 EOF teardown latency
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-public-6780-20261116']
    paths: ['tests/hia_native/public118_extract_teardown_diagnostic_ci/**', '.github/workflows/hia-extract-public-teardown-diagnostic.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LC_ALL: C.UTF-8
jobs:
  native-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete frozen inputs and readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public118_extract_teardown_diagnostic_ci
      - name: Download the fixed successful build and original domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/public118-input"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14293655303 > "$RUNNER_TEMP/public118-input/native.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14293655303/zip > "$RUNNER_TEMP/public118-input/native.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14293772158 > "$RUNNER_TEMP/public118-input/native-proof.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14293772158/zip > "$RUNNER_TEMP/public118-input/native-proof.zip"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14289302657' > "$RUNNER_TEMP/public118-input/prior.json"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14289302657/zip' > "$RUNNER_TEMP/public118-input/prior.zip"
      - name: Trace one actual process through complete EOF
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/source/tests/hia_native/public118_extract_teardown_diagnostic_ci/run.py" --input "$RUNNER_TEMP/public118-input" --output "$RUNNER_TEMP/public118-domain" --profile 'f2441ac8a6806234120b143209ec5c565b1cc4b3ccc8aff6f5138aa3b847e5f4' > "$RUNNER_TEMP/public118-domain-driver.stdout" 2> "$RUNNER_TEMP/public118-domain-driver.stderr"
      - name: Retain every original failure and new evidence byte
        if: always()
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/source/tests/hia_native/public118_extract_teardown_diagnostic_ci/base/ci/archive.py" pack --capture "$RUNNER_TEMP/public118-domain" --output "$RUNNER_TEMP/public118-domain-export" --package "$GITHUB_WORKSPACE/source/tests/hia_native/public118_extract_teardown_diagnostic_ci" --manifest-sha256 'f2441ac8a6806234120b143209ec5c565b1cc4b3ccc8aff6f5138aa3b847e5f4' --label 'actual-teardown' --driver-prefix "$RUNNER_TEMP/public118-domain-driver"
      - name: Upload complete successor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extract-public-teardown-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public118-domain-export
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
