      - 'src/mcp/fs/text_editing.rs'
      - 'src/mcp/fs/remote.rs'
      - 'src/mcp/fs/shell.rs'
      - 'src/mcp/fs/shell_tests.rs'
      - 'src/mcp/request_ctx.rs'
      - 'src/mcp/runtime/config.rs'
      - 'src/mcp/runtime/execution.rs'
      - 'src/mcp/runtime/execution_tests.rs'
      - 'src/mcp/runtime/jobs.rs'
      - 'src/mcp/runtime/binary.rs'
      - 'src/mcp/runtime/binary_file.py'
      - 'src/mcp/runtime/file_metadata.py'
      - 'src/mcp/runtime/inode_patch.py'
      - 'src/mcp/runtime/inspect.rs'
      - 'src/mcp/runtime/ssh.rs'
      - 'src/mcp/runtime/multi_read.rs'
      - 'src/mcp/runtime/multi_read_host.py'
      - 'src/mcp/runtime/operation_crypto.rs'
      - 'src/mcp/runtime/effect_owner_fence.rs'
      - 'src/mcp/runtime/effect_owner_fence_acquisition_tests.rs'
      - 'src/main.rs'
      - 'src/mcp/runtime/caller_scope.rs'
      - 'src/mcp/runtime/caller_scope_tests.rs'
      - 'src/mcp/runtime/search_jobs.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/*hia*native*'
      - 'scripts/*.S'
      - 'scripts/generate_hia_transport.py'
      - 'scripts/build_config_fs_probe.py'
      - 'scripts/build_config_mcp_service.py'
      - 'scripts/build_config_owner_probe.py'
      - 'scripts/build_hia_config_service.py'
      - 'scripts/config_schema.py'
      - 'scripts/hia_native_config_reference.py'
      - 'src/mcp/hia_contract.rs'
      - 'src/mcp/hia_provider.rs'
      - 'src/mcp/hia_tool_catalog.json'
      - 'src/mcp/rea_engine_profile.rs'
      - 'src/mcp/rea_provider.rs'
      - 'src/mcp/runtime/config_tests.rs'
      - 'src/mcp/runtime/effective_config.rs'
      - 'src/mcp/runtime/effective_config_tests.rs'
      - 'src/mcp/runtime/inspect_tests.rs'
      - 'src/mcp/weight_config.rs'
      - 'src/utils/json_size.rs'
      - 'scripts/compare_hia_runtime_rust.py'
      - 'tests/hia_native/**'
      - '.github/workflows/hia-runtime-native.yml'
      - 'src/mcp/server.rs'
      - 'src/utils/line_hash.rs'
      - 'src/utils/truncation.rs'
      - 'src/mcp/fs/delta.rs'
      - 'src/mcp/fs/core.rs'
      - 'src/mcp/fs/core_tests.rs'
      - 'src/mcp/fs/delta_tests.rs'
      - 'src/mcp/fs/file_ops.rs'
      - 'src/mcp/fs/fs_tests.rs'
      - 'src/mcp/fs/text_editing.rs'
      - 'src/mcp/fs/remote.rs'
      - 'src/mcp/fs/shell.rs'
      - 'src/mcp/fs/shell_tests.rs'
      - 'src/mcp/request_ctx.rs'
      - 'src/mcp/runtime/config.rs'
      - 'src/mcp/runtime/execution.rs'
      - 'src/mcp/runtime/execution_tests.rs'
      - 'src/mcp/runtime/jobs.rs'
      - 'src/mcp/runtime/binary.rs'
      - 'src/mcp/runtime/binary_file.py'
      - 'src/mcp/runtime/file_metadata.py'
      - 'src/mcp/runtime/inode_patch.py'
      - 'src/mcp/runtime/inspect.rs'
      - 'src/mcp/runtime/ssh.rs'
      - 'src/mcp/runtime/multi_read.rs'
      - 'src/mcp/runtime/multi_read_host.py'
      - 'src/mcp/runtime/operation_crypto.rs'
      - 'src/mcp/runtime/effect_owner_fence.rs'
      - 'src/mcp/runtime/effect_owner_fence_acquisition_tests.rs'
      - 'src/main.rs'
      - 'src/mcp/runtime/caller_scope.rs'
      - 'src/mcp/runtime/caller_scope_tests.rs'
      - 'src/mcp/runtime/search_jobs.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-runtime-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The same fresh cold/build bytes feed all four complete native partitions.
# Each job retains the original 15-minute limit; suite/owner limits are unchanged.
# The batch partition includes all four atomic-write suites and its full 505 MiB case.
# The aggregate uses the existing Rust 1.95.0 toolchain for its locked original owner.
jobs:
  prepare:
    name: Fresh full compiler cold gate and all native images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prepared_sha256: ${{ steps.prepare.outputs.prepared_sha256 }}
    steps:
      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Replay full cold gate and seal all native build artifacts
        id: prepare
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py prepare \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain fresh cold and native build, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    name: Complete native partition (${{ matrix.group }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [batch, text, json, system]
    steps:
      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Download this invocation's sealed cold and native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/

      - name: Execute every declared suite in this partition
        id: shard
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py shard \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --prepared-sha256 "${{ needs.prepare.outputs.prepared_sha256 }}" \
            --group "${{ matrix.group }}" \
            --export "$RUNNER_TEMP/hia-native-shard"

      - name: Retain complete partition process and corpus evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-shard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/hia-native-shard/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Capture failure diagnostics outside effect fixtures
        if: ${{ always() && steps.shard.outcome != 'success' }}
        run: |
          python3 -I -B runtime/scripts/hia_native_failure.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --destination "$RUNNER_TEMP/hia-native-diagnostics"

      - name: Retain readable partition failure diagnostics
        if: ${{ always() && steps.shard.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/hia-native-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Retain original failure bytes and prepared artifacts
        if: ${{ always() && steps.shard.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-failure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/hia-runtime-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: All native evidence and complete original Rust comparisons
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Download this invocation's sealed cold and native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/

      - name: Download every completed partition separately
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hia-native-shard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/hia-native-shards/
          merge-multiple: false

      - name: Verify complete source-bound native evidence
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py collect \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --prepared-sha256 "${{ needs.prepare.outputs.prepared_sha256 }}" \
            --shards "$RUNNER_TEMP/hia-native-shards"

      - name: Compare all declared original owners and Rust references
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          python3 -I -B runtime/scripts/compare_hia_runtime_rust.py \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --rustc "$(rustup which --toolchain 1.95.0 rustc)"

      - name: Reject altered configuration and regex evidence
        run: |
          timeout --signal=KILL 180 python3 -I -B runtime/tests/hia_native/check_regex_evidence.py \
            --repo "$GITHUB_WORKSPACE/runtime" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --report "$RUNNER_TEMP/hia-runtime-native/result.json" \
            --receipt "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.json" \
            > "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.stdout" \
            2> "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.stderr"

      - name: Capture failed aggregate diagnostics outside effect fixtures
        if: failure()
        run: |
          python3 -I -B runtime/scripts/hia_native_failure.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --destination "$RUNNER_TEMP/hia-native-diagnostics"

      - name: Retain readable aggregate failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/hia-native-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Retain complete aggregate, originals and immutable shard receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-runtime-native-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
