  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hia-runtime-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The same fresh cold/build bytes feed all eight complete native partitions.
# Prepare and native partitions retain 15 minutes; original groups run independently.
# Every individual suite, owner and stream deadline remains unchanged.
# Independent View render/state suites run apart from the complete public View chain.
# The batch partition includes all four atomic-write suites and its full 505 MiB case.
# Seven original groups retain all recipes and fixed Rust 1.95.0; the final job admits every group.
jobs:
  prepare:
    name: Fresh full compiler cold gate and all native images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prepared_sha256: ${{ steps.prepare.outputs.prepared_sha256 }}
    steps:
      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            tests/oracles
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Verify source coverage and evidence snapshot controls
        run: |
          python3 -I -B runtime/tests/hia_native/test_migration_target.py
          python3 -I -B runtime/tests/hia_native/test_evidence_snapshot.py
          python3 -I -B runtime/tests/hia_native/test_native_pipeline.py

      - name: Replay full cold gate and seal all native build artifacts
        id: prepare
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py prepare \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain fresh cold and native build, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    name: Complete native partition (${{ matrix.group }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [batch, text, shell, view_components, view, json, config, system]
    steps:
      - name: Install filesystem syscall trace observer
        if: matrix.group == 'system' || matrix.group == 'shell' || matrix.group == 'config'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace

      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            tests/oracles
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Download this invocation's sealed cold and native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/

      - name: Execute every declared suite in this partition
        id: shard
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py shard \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --prepared-sha256 "${{ needs.prepare.outputs.prepared_sha256 }}" \
            --group "${{ matrix.group }}" \
            --export "$RUNNER_TEMP/hia-native-shard"

      - name: Retain complete partition process and corpus evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-shard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/hia-native-shard/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stage failure diagnostics and archive untouched fixtures
        if: ${{ always() && steps.shard.outcome != 'success' }}
        run: |
          python3 -I -B runtime/scripts/hia_native_failure_evidence.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --output "$RUNNER_TEMP/hia-native-failure-evidence"

      - name: Retain failure diagnostics and archive, including incomplete archives
        if: ${{ always() && steps.shard.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-failure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/hia-native-failure-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native_collect:
    name: Admit every native partition and seal original inputs
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_sha256: ${{ steps.original_inputs.outputs.native_sha256 }}
    steps:
      - name: Install filesystem syscall trace observer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace

      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            tests/oracles
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"

      - name: Download this invocation's sealed cold and native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hia-native-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/

      - name: Download every completed partition separately
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hia-native-shard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/hia-native-shards/
          merge-multiple: false

      - name: Verify complete source-bound native evidence
        run: |
          python3 -I -B runtime/scripts/hia_native_pipeline.py collect \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --prepared-sha256 "${{ needs.prepare.outputs.prepared_sha256 }}" \
            --shards "$RUNNER_TEMP/hia-native-shards"


      - name: Seal unchanged full native evidence for original groups
        id: original_inputs
        run: |
          python3 -I -B runtime/scripts/hia_native_rust_pipeline.py prepare \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain admitted complete native evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-complete-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Capture native collection failure diagnostics
        if: ${{ always() && steps.original_inputs.outcome != 'success' }}
        run: |
          python3 -I -B runtime/scripts/hia_native_failure_evidence.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --output "$RUNNER_TEMP/hia-native-diagnostics"

      - name: Retain native collection failure diagnostics
        if: ${{ always() && steps.original_inputs.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-native-collect
          path: ${{ runner.temp }}/hia-native-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  original_bytes:
    name: Complete original bytes recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: bytes
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_state:
    name: Complete original state recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: state
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_services:
    name: Complete original services recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: services
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_json:
    name: Complete original json recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: json
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_config:
    name: Complete original config recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: config
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_system:
    name: Complete original system recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: system
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  original_batch:
    name: Complete original batch recipes
    needs: native_collect
    uses: ./.github/workflows/hia-runtime-original-shard.yml
    with:
      group: batch
      runtime-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      invocation: ${{ github.run_id }}-${{ github.run_attempt }}
      native-sha256: ${{ needs.native_collect.outputs.native_sha256 }}

  qualify:
    name: All native evidence and complete original Rust comparisons
    needs: [native_collect, original_bytes, original_state, original_services, original_json, original_config, original_system, original_batch]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            tests/oracles
            .github

      - name: Checkout pinned HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false

      - name: Install pinned independent Python reference libraries
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: \
            -r runtime/tests/hia_native/python-reference-requirements.txt
          echo "$RUNNER_TEMP/hia-native-python/bin" >> "$GITHUB_PATH"

      - name: Verify exact source head
        env:
          EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$EXPECTED_RUNTIME_SHA"


      - name: Download this invocation's admitted complete native evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hia-native-complete-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-runtime-native/

      - name: Download every successful original group separately
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hia-original-shard-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/hia-original-shards/
          merge-multiple: false

      - name: Verify every original group and run quiescent evidence controls
        id: collect
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          python3 -I -B runtime/scripts/hia_native_rust_pipeline.py collect \
            --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --invocation "${{ github.run_id }}-${{ github.run_attempt }}" \
            --native-sha256 "${{ needs.native_collect.outputs.native_sha256 }}" \
            --shards "$RUNNER_TEMP/hia-original-shards" \
            --shard-sha256 "bytes=${{ needs.original_bytes.outputs.sha256 }}" \
            --shard-sha256 "state=${{ needs.original_state.outputs.sha256 }}" \
            --shard-sha256 "services=${{ needs.original_services.outputs.sha256 }}" \
            --shard-sha256 "json=${{ needs.original_json.outputs.sha256 }}" \
            --shard-sha256 "config=${{ needs.original_config.outputs.sha256 }}" \
            --shard-sha256 "system=${{ needs.original_system.outputs.sha256 }}" \
            --shard-sha256 "batch=${{ needs.original_batch.outputs.sha256 }}"

      - name: Reject altered filesystem phase evidence
        run: |
          timeout --signal=KILL 180 python3 -I -B runtime/tests/hia_native/filesystem_parity/qualify_pipeline.py \
            --repo "$GITHUB_WORKSPACE/runtime" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --report "$RUNNER_TEMP/hia-runtime-native/result.json" \
            --controls "$RUNNER_TEMP/hia-runtime-native/filesystem-parity/pipeline-controls" \
            > "$RUNNER_TEMP/hia-runtime-native/filesystem-parity/pipeline-controls.stdout" \
            2> "$RUNNER_TEMP/hia-runtime-native/filesystem-parity/pipeline-controls.stderr"

      - name: Reject altered configuration and regex evidence
        id: regex
        run: |
          timeout --signal=KILL 180 python3 -I -B runtime/tests/hia_native/check_regex_evidence.py \
            --repo "$GITHUB_WORKSPACE/runtime" \
            --output "$RUNNER_TEMP/hia-runtime-native" \
            --report "$RUNNER_TEMP/hia-runtime-native/result.json" \
            --receipt "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.json" \
            > "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.stdout" \
            2> "$RUNNER_TEMP/hia-runtime-native/regex-evidence-controls.stderr"

      - name: Archive complete evidence with original Unix fixture names
        if: success()
        run: |
          python3 -I -B runtime/scripts/hia_native_failure_evidence.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --output "$RUNNER_TEMP/hia-native-complete-evidence"

      - name: Retain complete aggregate, originals and immutable shard receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-runtime-native-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-native-complete-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stage failure diagnostics and archive untouched fixtures
        if: failure()
        run: |
          python3 -I -B runtime/scripts/hia_native_failure_evidence.py \
            --source "$RUNNER_TEMP/hia-runtime-native" \
            --output "$RUNNER_TEMP/hia-native-failure-evidence"

      - name: Retain failure diagnostics and archive, including incomplete archives
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-native-failure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/hia-native-failure-evidence/
          if-no-files-found: error
          retention-days: 14
