name: HIA common candidate native integration

on:
  push:
    branches:
      - 'codex/hia-native-helper-runtime-*'
      - 'codex/hia-three-loop-*'
  pull_request:
    paths:
      - 'src/mcp/hia_*'
      - 'tests/hia_native_helper_mcp_integration.py'
      - 'tests/test_hia_native_helper_mcp_integration.py'
      - 'tests/hia_native_language_coverage.py'
      - 'tests/test_hia_native_language_coverage.py'
      - 'tests/hia_native_bootstrap_distribution.py'
      - 'tests/test_hia_native_bootstrap_distribution.py'
      - '.github/workflows/hia-common-native-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliberate HOLD until the final source and its actual native distribution
  # are published and independently pinned. An empty value never selects HEAD.
  HEPTA_SOURCE_SHA: ''
  HEPTA_BOOTSTRAP_DISTRIBUTION_SHA: ''
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  common-native:
    name: Fixed candidate cold, language, MCP and native lease integration
    runs-on: ubuntu-24.04
    # Aggregate observer budget includes the ordinary release owner's existing
    # 1800-second deadline. Native cold remains exactly 180 seconds plus 3 cleanup.
    timeout-minutes: 90
    steps:
      - name: Checkout exact Runtime candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact Runtime source and prepare retained outcomes
        id: runtime_identity
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-common-stage"
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD > "$RUNNER_TEMP/hia-common-stage/runtime-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/hia-common-stage/runtime-tree.txt"

      - name: Install qualification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Reject foreign cold sources, substituted bootstrap assets and cached imports
        id: source_controls
        run: |
          set -euo pipefail
          python -I -B tests/test_hia_native_helper_mcp_integration.py -v 2>&1 | tee "$RUNNER_TEMP/hia-common-stage/source-admission-tests.log"
          python -I -B tests/test_hia_native_language_coverage.py -v 2>&1 | tee "$RUNNER_TEMP/hia-common-stage/native-language-controls.log"
          python -I -B tests/test_hia_native_bootstrap_distribution.py -v 2>&1 | tee "$RUNNER_TEMP/hia-common-stage/bootstrap-distribution-controls.log"

      - name: Require both finalized native source and distribution commit pins
        id: pins
        run: |
          set -euo pipefail
          if ! [[ "$HEPTA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$HEPTA_BOOTSTRAP_DISTRIBUTION_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$HEPTA_SOURCE_SHA" = "$HEPTA_BOOTSTRAP_DISTRIBUTION_SHA" ]]; then
            echo 'HOLD: final native source F and its published bootstrap distribution D are not both pinned.' >&2
            exit 1
          fi

      - name: Checkout the frozen Hepta source F
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrillionniumFoundation/Hepta
          ref: ${{ env.HEPTA_SOURCE_SHA }}
          path: hia-source
          persist-credentials: false

      - name: Checkout the independently pinned native distribution D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrillionniumFoundation/Hepta
          ref: ${{ env.HEPTA_BOOTSTRAP_DISTRIBUTION_SHA }}
          path: hia-bootstrap-distribution
          persist-credentials: false

      - name: Verify source identities and matching HIA catalogs
        id: sources
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SOURCE_SHA"
          test "$(git -C hia-source rev-parse HEAD)" = "$HEPTA_SOURCE_SHA"
          test "$(git -C hia-bootstrap-distribution rev-parse HEAD)" = "$HEPTA_BOOTSTRAP_DISTRIBUTION_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C hia-source status --porcelain --untracked-files=no)"
          cmp src/mcp/hia_tool_catalog.json hia-source/docs/HIA_AGENT_NATIVE_TOOL_CATALOG.json
          git -C hia-source rev-parse HEAD > "$RUNNER_TEMP/hia-common-stage/hepta-commit.txt"
          git -C hia-source rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/hia-common-stage/hepta-tree.txt"
          git -C hia-bootstrap-distribution rev-parse HEAD > "$RUNNER_TEMP/hia-common-stage/distribution-commit.txt"

      - name: Admit native bootstrap assets and copy the exact frozen native source
        id: distribution
        run: |
          set -euo pipefail
          python -I -B tests/hia_native_bootstrap_distribution.py \
            --hepta "$GITHUB_WORKSPACE/hia-source" \
            --distribution "$GITHUB_WORKSPACE/hia-bootstrap-distribution" \
            --expected-hepta-source "$HEPTA_SOURCE_SHA" \
            --expected-distribution "$HEPTA_BOOTSTRAP_DISTRIBUTION_SHA" \
            --output "$RUNNER_TEMP/hia-common-bootstrap" \
            --report "$RUNNER_TEMP/hia-common-stage/bootstrap-distribution.json" \
            > "$RUNNER_TEMP/hia-common-stage/bootstrap-distribution.stdout" \
            2> "$RUNNER_TEMP/hia-common-stage/bootstrap-distribution.stderr"

      - name: Install external qualification prerequisites and real OpenSSH
        id: dependencies
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hia-llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/hia-llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/hia-llvm.asc" /usr/share/keyrings/hia-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/hia-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/hia-llvm20.list
          sudo apt-get update
          sudo apt-get install -y binutils gcc clang-20 libclang-rt-20-dev strace openssh-server
          printf 'CLANG=/usr/bin/clang-20\nHEPTA_CLANG=/usr/bin/clang-20\n' >> "$GITHUB_ENV"
          python -m pip install setuptools==78.1.1 wheel==0.46.3 z3-solver==4.15.4.0 jsonschema==4.26.0
          python --version > "$RUNNER_TEMP/hia-common-stage/python.txt"
          /usr/bin/clang-20 --version > "$RUNNER_TEMP/hia-common-stage/clang.txt"
          /usr/bin/ld --version > "$RUNNER_TEMP/hia-common-stage/ld.txt"

      - name: Install pinned Runtime toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version > "$RUNNER_TEMP/hia-common-stage/rustc.txt"
          cargo --version > "$RUNNER_TEMP/hia-common-stage/cargo.txt"

      - name: Build the exact Runtime candidate
        id: build
        run: |
          set -euo pipefail
          cargo build --locked --all-features --bin hepta-runtime 2>&1 | tee "$RUNNER_TEMP/hia-common-stage/runtime-build.log"
          sha256sum target/debug/hepta-runtime > "$RUNNER_TEMP/hia-common-stage/runtime-binary.sha256"

      - name: Construct all native qualification tools from the seven initial roots
        id: prebuild
        if: ${{ !cancelled() && steps.distribution.outcome == 'success' && steps.source_controls.outcome == 'success' }}
        run: |
          set -euo pipefail
          env -i PATH= LANG=C LC_ALL=C TZ=UTC \
            "$RUNNER_TEMP/hia-common-bootstrap/hia-cold-build" \
            --source "$RUNNER_TEMP/hia-common-bootstrap/source" \
            --bootstrap "$RUNNER_TEMP/hia-common-bootstrap/bootstrap" \
            --output "$RUNNER_TEMP/hia-common-toolchain" \
            > "$RUNNER_TEMP/hia-common-stage/prebuild.stdout" \
            2> "$RUNNER_TEMP/hia-common-stage/prebuild.stderr"

      - name: Actual sixty-phase native cold replay with unchanged 180 plus 3 budget
        id: cold
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        run: |
          set -euo pipefail
          env -i PATH= LANG=C LC_ALL=C TZ=UTC \
            "$RUNNER_TEMP/hia-common-toolchain/hia-cold" \
            --source "$RUNNER_TEMP/hia-common-bootstrap/source" \
            --output "$RUNNER_TEMP/hia-common-cold" \
            --toolchain "$RUNNER_TEMP/hia-common-toolchain" \
            --bundle "$RUNNER_TEMP/hia-common-toolchain/cold-bundle.hiadat" \
            > "$RUNNER_TEMP/hia-common-stage/cold.stdout" \
            2> "$RUNNER_TEMP/hia-common-stage/cold.stderr"

      - name: Admit the actual cold report and construct the native release bootstrap
        id: post
        if: ${{ !cancelled() && steps.cold.outcome == 'success' }}
        run: |
          set -euo pipefail
          env -i PATH= LANG=C LC_ALL=C TZ=UTC \
            "$RUNNER_TEMP/hia-common-toolchain/hia-source-bootstrap" \
            --source "$RUNNER_TEMP/hia-common-bootstrap/source" \
            --cold "$RUNNER_TEMP/hia-common-cold" \
            --bootstrap "$RUNNER_TEMP/hia-common-bootstrap/bootstrap" \
            --output "$RUNNER_TEMP/hia-common-post" \
            > "$RUNNER_TEMP/hia-common-stage/post.stdout" \
            2> "$RUNNER_TEMP/hia-common-stage/post.stderr"

      - name: Build and publish the formal source-bound native release package
        id: release
        if: ${{ !cancelled() && steps.post.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hia-common-release"
          env -i PATH= LANG=C LC_ALL=C TZ=UTC \
            "$RUNNER_TEMP/hia-common-post/hia-release-build" \
            --output "$RUNNER_TEMP/hia-common-release/release" \
            --compiler "$RUNNER_TEMP/hia-common-cold/qualification/base/B3.flat" \
            --cold-report "$RUNNER_TEMP/hia-common-cold/final-cold.json" \
            --source "$RUNNER_TEMP/hia-common-bootstrap/source" \
            --timeout-seconds 1800 \
            > "$RUNNER_TEMP/hia-common-stage/release.stdout.json" \
            2> "$RUNNER_TEMP/hia-common-stage/release.stderr"

      - name: Execute every original language witness with the admitted native B3 and M3
        id: language
        if: ${{ !cancelled() && steps.post.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" HOME="$HOME" LANG=C LC_ALL=C TZ=UTC \
            python -I -B tests/hia_native_language_coverage.py \
            --hepta "$GITHUB_WORKSPACE/hia-source" \
            --runtime-source "$GITHUB_WORKSPACE" \
            --expected-hepta-source "$HEPTA_SOURCE_SHA" \
            --expected-runtime-source "$RUNTIME_SOURCE_SHA" \
            --cold-report "$RUNNER_TEMP/hia-common-cold/final-cold.json" \
            --native-source-bootstrap "$RUNNER_TEMP/hia-common-post" \
            --output "$RUNNER_TEMP/hia-common-language.json" \
            > "$RUNNER_TEMP/hia-common-stage/language.stdout" \
            2> "$RUNNER_TEMP/hia-common-stage/language.stderr"

      - name: Real stdio MCP, SSH worker, native image and consumer lifecycle
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.source_controls.outcome == 'success' && steps.release.outcome == 'success' }}
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -I -B tests/hia_native_helper_mcp_integration.py \
            --runtime "$GITHUB_WORKSPACE/target/debug/hepta-runtime" \
            --runtime-source "$GITHUB_WORKSPACE" \
            --hepta "$GITHUB_WORKSPACE/hia-source" \
            --expected-runtime-source "$RUNTIME_SOURCE_SHA" \
            --expected-hepta-source "$HEPTA_SOURCE_SHA" \
            --cold-report "$RUNNER_TEMP/hia-common-cold/final-cold.json" \
            --native-source-bootstrap "$RUNNER_TEMP/hia-common-post" \
            --native-release-package "$RUNNER_TEMP/hia-common-release/release/store.hiapack" \
            --native-release-receipt "$RUNNER_TEMP/hia-common-stage/release.stdout.json" \
            --output "$RUNNER_TEMP/hia-common-native" \
            --allow-disposable-sshd 2>&1 | tee "$RUNNER_TEMP/hia-common-stage/integration.log"

      - name: Preserve original stage outcomes
        if: always()
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNTIME_IDENTITY_OUTCOME: ${{ steps.runtime_identity.outcome }}
          PINS_OUTCOME: ${{ steps.pins.outcome }}
          SOURCES_OUTCOME: ${{ steps.sources.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREBUILD_OUTCOME: ${{ steps.prebuild.outcome }}
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          LANGUAGE_OUTCOME: ${{ steps.language.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          SOURCE_CONTROLS_OUTCOME: ${{ steps.source_controls.outcome }}
        run: |
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "hia-common-stage"
          path.mkdir(exist_ok=True)
          outcomes = {name.lower(): os.environ[name + "_OUTCOME"] for name in
                      ("RUNTIME_IDENTITY", "PINS", "SOURCES", "DISTRIBUTION", "DEPENDENCIES", "BUILD",
                       "PREBUILD", "COLD", "POST", "RELEASE", "LANGUAGE", "INTEGRATION", "SOURCE_CONTROLS")}
          report = {"schema": "hepta.runtime.common-native-candidate-stages.v2",
                    "status": "PASS" if all(value == "success" for value in outcomes.values()) else "HOLD",
                    "runtime_source": os.environ["RUNTIME_SOURCE_SHA"],
                    "hepta_source": os.environ["HEPTA_SOURCE_SHA"],
                    "bootstrap_distribution": os.environ["HEPTA_BOOTSTRAP_DISTRIBUTION_SHA"],
                    "original_stage_outcomes": outcomes,
                    "cold_wall_seconds": 180, "cold_cleanup_seconds": 3,
                    "ordinary_release_wall_seconds": 1800,
                    "production_activated": False, "whole_worker_native": False,
                    "original_language_witnesses_require_actual_native_cold_B3_M3": True,
                    "source_controls_precede_cold_and_publication": True}
          (path / "stage-outcomes.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Retain raw qualification reports, source exports and MCP records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hia-common-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-common-stage/
            ${{ runner.temp }}/hia-common-toolchain/
            ${{ runner.temp }}/hia-common-cold/
            ${{ runner.temp }}/hia-common-post/
            ${{ runner.temp }}/hia-common-release/
            ${{ runner.temp }}/hia-common-language.json
            ${{ runner.temp }}/hia-common-language.assertions.json
            ${{ runner.temp }}/hia-common-language.evidence/
            ${{ runner.temp }}/hia-common-native/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
