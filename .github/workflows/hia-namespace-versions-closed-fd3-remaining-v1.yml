name: Qualify HIA Watcher with closed standard descriptors
on:
  push:
    branches: [hia-namespace-versions-closed-fd3-remaining-v1-6780-20261118]
permissions:
  contents: read
  actions: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [fd3-names-closed-1, fd3-names-closed-2, fd3-names-closed-3, fd3-names-closed-4, fd3-names-closed-5, fd3-names-closed-6, fd3-content-closed-1, fd3-content-closed-2, fd3-content-closed-3, fd3-content-closed-4, fd3-content-closed-5, fd3-content-closed-6, fd3-content-closed-7]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Freeze the entire actual source, domain and independent readers
        shell: bash
        run: |
          set -euo pipefail
          NAMESPACE_ACTUAL_ROOT="$RUNNER_TEMP/namespace-versions-actual-${{ matrix.group }}"
          printf 'NAMESPACE_ACTUAL_ROOT=%s\n' "$NAMESPACE_ACTUAL_ROOT" >> "$GITHUB_ENV"
          mkdir "$NAMESPACE_ACTUAL_ROOT"
          cp -a qualification/namespace_versions/v1/closed_fd3_v1 "$NAMESPACE_ACTUAL_ROOT/source"
          mkdir "$NAMESPACE_ACTUAL_ROOT/outer"
          python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"namespace-versions-actual-${{ matrix.group }}/source"
          raw=(r/"SOURCE_MANIFEST.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="03312dcf472d07300a0d379f9ea4ed10fe026ca84650cabd5bfcbd40853d817b"
          m=json.loads(raw)
          assert {p.relative_to(r).as_posix()for p in r.rglob("*")if p.is_file()}=={x["path"]for x in m["files"]}|{"SOURCE_MANIFEST.json"}
          for row in m["files"]:
              b=(r/row["path"]).read_bytes()
              assert len(b)==row["bytes"]and hashlib.sha256(b).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()==row["git_blob"]
              if row["path"].endswith(".py"):compile(b,str(r/row["path"]),"exec")
          PY
      - name: Install the actual syscall observer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace
      - name: Admit both retained builds and execute this fresh actual group once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B "$NAMESPACE_ACTUAL_ROOT/source/gate.py" \
            --workspace "$NAMESPACE_ACTUAL_ROOT" --group "${{ matrix.group }}" \
            > "$NAMESPACE_ACTUAL_ROOT/outer/gate.stdout" 2> "$NAMESPACE_ACTUAL_ROOT/outer/gate.stderr"
      - name: Preserve all actual success or failure streams
        if: always()
        shell: bash
        run: |
          if test -f "$NAMESPACE_ACTUAL_ROOT/outer/gate.stdout"; then cat "$NAMESPACE_ACTUAL_ROOT/outer/gate.stdout"; fi
          if test -f "$NAMESPACE_ACTUAL_ROOT/outer/gate.stderr"; then cat "$NAMESPACE_ACTUAL_ROOT/outer/gate.stderr"; fi
      - name: Archive and reread every complete file, directory and mode without replay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180 python3 -I -B "$NAMESPACE_ACTUAL_ROOT/source/export.py" \
            --workspace "$NAMESPACE_ACTUAL_ROOT" --archive "$RUNNER_TEMP/namespace-versions-actual-${{ matrix.group }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespace-versions-actual-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/namespace-versions-actual-${{ matrix.group }}.tar.gz
            ${{ runner.temp }}/namespace-versions-actual-${{ matrix.group }}.tar.gz.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
