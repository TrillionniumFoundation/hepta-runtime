name: Exact F64 intent research qualification

on:
  pull_request:
    paths:
      - "qualification/weight_value_intent_20261121/**"
      - "qualification/weight_semantic_adapter_20261120/**"
      - "qualification/weight_continuation_runtime_20261121/**"
      - ".github/workflows/weight-value-intent.yml"
  push:
    branches: [main]
    paths:
      - "qualification/weight_value_intent_20261121/**"
      - "qualification/weight_semantic_adapter_20261120/**"
      - "qualification/weight_continuation_runtime_20261121/**"
      - ".github/workflows/weight-value-intent.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Typed F64 intent controls (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features]
    defaults:
      run:
        shell: bash
        working-directory: qualification/weight_value_intent_20261121
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-value-intent-target
        run: cargo +1.95.0 fmt -- --check --config-path rustfmt.toml
      - name: Run synthetic unit tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-value-intent-target
        run: |
          umask 022
          cargo +1.95.0 test --locked --all-targets --${{ matrix.features }} -- --test-threads=1
      - name: Lint standalone crate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hepta-value-intent-target
        run: cargo +1.95.0 clippy --locked --all-targets --${{ matrix.features }} -- -D warnings
