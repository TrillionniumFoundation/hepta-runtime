name: Current SDK publisher asynchronous reference build
on:
  workflow_dispatch:
  push:
    branches: ['hia-publisher-async-reference-6780-v1-20261117']
    paths: ['tests/hia_native/text_publication_async_reference_ci/**', '.github/workflows/hia-publisher-async-reference-v1.yml']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C.UTF-8
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "TP_PACKAGE=$GITHUB_WORKSPACE/candidate/tests/hia_native/text_publication_async_reference_ci/source" "TP_OUTPUT=$RUNNER_TEMP/publisher-async-reference" "TP_EXPORT=$RUNNER_TEMP/publisher-async-reference-export" "TP_DRIVER=$RUNNER_TEMP/publisher-async-reference-driver" >> "$GITHUB_ENV"
      - name: Checkout exact candidate reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/text_publication_async_reference_ci/source
      - name: Checkout exact unchanged target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: target
          ref: d3d75c30719db966b004756f610007a7c723729e
          persist-credentials: false
          sparse-checkout: |
            src
      - name: Bind exact observer and 120 unchanged original spans
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)" = d3d75c30719db966b004756f610007a7c723729e
          test "$(sha256sum "$TP_PACKAGE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = 50d9572df0764dc99dee9031369fea569a6bf0e0b55bd4fa158210ea198dcf06
          python3 -I -S -B "$TP_PACKAGE/recipe/check_source.py" --source "$TP_PACKAGE"
          python3 -I -S -B "$TP_PACKAGE/recipe/verify_reference.py" --reference "$TP_PACKAGE/reference" --target "$GITHUB_WORKSPACE/target"
      - name: Install exact Rust1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          printf '%s\n' "TP_RUST_BIN=$(dirname "$(rustup which --toolchain 1.95.0 rustc)")" >> "$GITHUB_ENV"
      - name: Fresh actual SDK asynchronous observer build
        run: |
          set +e
          python3 -I -S -B "$TP_PACKAGE/recipe/build_reference.py" --reference "$TP_PACKAGE/reference" --output "$TP_OUTPUT" --toolchain "$TP_RUST_BIN" --target "$GITHUB_WORKSPACE/target" > "$TP_DRIVER.stdout" 2> "$TP_DRIVER.stderr"
          tp_status=$?
          cat "$TP_DRIVER.stderr"
          cat "$TP_DRIVER.stdout"
          exit "$tp_status"
      - name: Preserve complete reference and any failure
        if: always()
        run: |
          python3 -I -S -B "$TP_PACKAGE/recipe/archive.py" pack --source "$TP_PACKAGE" --capture "$TP_OUTPUT" --output "$TP_EXPORT" --driver-prefix "$TP_DRIVER"
      - name: Upload full reference archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publisher-async-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.TP_EXPORT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
