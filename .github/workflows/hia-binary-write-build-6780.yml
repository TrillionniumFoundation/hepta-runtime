name: Build HIA locked binary write composition from retained B3
on:
  workflow_dispatch:
  push:
    branches: [hia-binary-write-build-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      WRITE_SOURCE: ${{ github.workspace }}/runtime/qualification/binary_write_body/v1/native_build
      WRITE_MANIFEST: e7050823c9be6d65c7041491816a6dd88c657edff921a9dee34fb87933ce4cc6
    steps:
      - name: Checkout complete frozen production and reader source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/binary_write_body/v1/native_build
          persist-credentials: false
      - name: Checkout exact HIA compiler dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact frozen heads
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
      - name: Compile nine runtime images and read complete native composition
        run: |
          python3 -I -S -B "$WRITE_SOURCE/scripts/build_gate.py" build \
            --work "$RUNNER_TEMP/binary-write-body-build" --hepta "$GITHUB_WORKSPACE/compiler" \
            --source-manifest-sha256 "$WRITE_MANIFEST"
      - name: Preserve all complete or failed build bytes
        if: always()
        run: |
          python3 -I -S -B "$WRITE_SOURCE/scripts/build_gate.py" export \
            --work "$RUNNER_TEMP/binary-write-body-build" --output "$RUNNER_TEMP/binary-write-body-build-export" \
            --source-manifest-sha256 "$WRITE_MANIFEST"
      - name: Upload complete build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-write-body-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary-write-body-build-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
