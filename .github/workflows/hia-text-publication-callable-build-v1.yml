name: Build fixed text publication native callable
on:
  workflow_dispatch:
  push:
    branches: ['hia-text-publication-callable-build-6780-v2-20261117']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C.UTF-8
jobs:
  fixed-callable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime variables
        run: |
          printf '%s\n' "PC_SOURCE=$GITHUB_WORKSPACE/runtime/tests/hia_native/text_publication_callable_ci/source" "PC_OUTPUT=$RUNNER_TEMP/text-publication-callable-build" "PC_EXPORT=$RUNNER_TEMP/text-publication-callable-build-export" "PC_DRIVER=$RUNNER_TEMP/text-publication-callable-build-driver" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/text_publication_callable_ci/source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source closure
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse HEAD)" = "${{ github.sha }}"
          test "$(sha256sum "$PC_SOURCE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = a036bc4d8ee78531a7562ad8b2162fe0aa965be189c359361b40bc9ffe96d096
          test "$(git -C "$GITHUB_WORKSPACE/compiler" rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C "$GITHUB_WORKSPACE/compiler" rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
          python3 -I -S -B "$PC_SOURCE/scripts/build_callable.py" check --source "$PC_SOURCE"
      - name: Five fresh HIA compiles and actual HIA link and pack
        run: |
          python3 -I -S -B "$PC_SOURCE/scripts/build_callable.py" build --source "$PC_SOURCE" --hepta "$GITHUB_WORKSPACE/compiler" --output "$PC_OUTPUT" > "$PC_DRIVER.stdout" 2> "$PC_DRIVER.stderr"
      - name: Preserve full source and actual build bytes
        if: always()
        run: |
          python3 -I -S -B "$PC_SOURCE/scripts/archive.py" pack --source "$PC_SOURCE" --capture "$PC_OUTPUT" --output "$PC_EXPORT" --driver-prefix "$PC_DRIVER"
      - name: Upload complete build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: text-publication-callable-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PC_EXPORT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
