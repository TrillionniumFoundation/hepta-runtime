name: Public123 exact historical58 source materialization
on:
  workflow_dispatch:
  push:
    branches: ['hia-public123-history-profile-qualification-6780-v1-20261117']
    paths: ['qualification/public123_history_profile_v1/source/**', '.github/workflows/hia-public123-history-profile-v1.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C.UTF-8
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "PACKAGE=$GITHUB_WORKSPACE/recipe/qualification/public123_history_profile_v1/source" "CAPTURE=$RUNNER_TEMP/public123-history/capture" "WORK=$RUNNER_TEMP/public123-history/work" "EXPORT=$RUNNER_TEMP/public123-history-export" "DRIVER=$RUNNER_TEMP/public123-history-driver" >> "$GITHUB_ENV"
      - name: Checkout exact qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: recipe
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/public123_history_profile_v1/source
      - name: Checkout complete installed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: before
          ref: 5a5a35b355b7b58a23da797acd0002a832fc919b
          persist-credentials: false
      - name: Checkout complete isolated successor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: after
          ref: 8fd1718de5b61c751d9e3c0716bc90b38afefff3
          persist-credentials: false
      - name: Verify source closure and syntax
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/recipe" rev-parse HEAD)" = "${{ github.sha }}"
          test "$(sha256sum "$PACKAGE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = af6b47d6538ddbd7bd3f9343ead0b18242ddf0eefaab53b1c9796039e4aceb58
          python3 -I -B -c 'import runpy,sys; runpy.run_path(sys.argv[1])["inputs"]()' "$PACKAGE/entry.py"
      - name: Complete full and actual sparse source materializations and physical refusals
        run: |
          set +e
          python3 -I -B "$PACKAGE/entry.py" capture --before "$GITHUB_WORKSPACE/before" --after "$GITHUB_WORKSPACE/after" --capture "$CAPTURE" --work "$WORK" > "$DRIVER.stdout" 2> "$DRIVER.stderr"
          status=$?
          cat "$DRIVER.stderr"
          test "$status" -ne 0 || cat "$DRIVER.stdout"
          exit "$status"
      - name: Complete read-only verification
        run: python3 -I -B "$PACKAGE/entry.py" read --capture "$CAPTURE" --output "$CAPTURE-readonly.json"
      - name: Export complete source and failure-or-success evidence
        if: always()
        run: python3 -I -B "$PACKAGE/archive.py" pack --source "$PACKAGE" --capture "$CAPTURE" --output "$EXPORT" --driver-prefix "$DRIVER"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public123-history-source-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EXPORT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
  uploaded-read:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "PACKAGE=$GITHUB_WORKSPACE/recipe/qualification/public123_history_profile_v1/source" "WORK=$RUNNER_TEMP/public123-history-read-work" "PROOF=$RUNNER_TEMP/public123-history-proof" "EXPORT=$RUNNER_TEMP/public123-history-read-export" "DRIVER=$RUNNER_TEMP/public123-history-read-driver" >> "$GITHUB_ENV"
      - name: Checkout exact frozen pure reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: recipe
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/public123_history_profile_v1/source
      - name: Read every uploaded byte and repeat exact source proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/recipe" rev-parse HEAD)" = "${{ github.sha }}"
          set +e
          python3 -I -B "$PACKAGE/read_uploaded.py" --run "${{ github.run_id }}" --artifact-name "public123-history-source-${{ github.sha }}-${{ github.run_attempt }}" --work "$WORK" --output "$PROOF" > "$DRIVER.stdout" 2> "$DRIVER.stderr"
          status=$?
          cat "$DRIVER.stderr"
          test "$status" -ne 0 || cat "$DRIVER.stdout"
          exit "$status"
      - name: Preserve complete independent proof and any failure
        if: always()
        run: python3 -I -B "$PACKAGE/archive.py" pack --source "$PACKAGE" --capture "$PROOF" --output "$EXPORT" --driver-prefix "$DRIVER"
      - name: Upload complete independent proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public123-history-read-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EXPORT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
