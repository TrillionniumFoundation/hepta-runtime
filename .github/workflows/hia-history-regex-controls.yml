name: Complete original historical configuration regex evidence controls
on:
  push:
    branches: [hia-history-aggregate-readback-6780-20261117]
    paths: ['.github/workflows/hia-history-regex-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen pure-evidence continuation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/history_aggregate_recovery/regex-controls-v1
      - name: Verify all frozen source and Python syntax
        run: |
          mkdir -p "$RUNNER_TEMP/history-regex-proof/logs"
          echo "8ea97073a0cfeda9ea2be8f621fed3d76bb26c81d00bfc6c0f1e5c2a8ee22895  qualification/history_aggregate_recovery/regex-controls-v1/SOURCE_MANIFEST.json" | sha256sum --check --strict
          timeout --signal=KILL 60 python3 -I -S -B - qualification/history_aggregate_recovery/regex-controls-v1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/"SOURCE_MANIFEST.json").read_bytes())
          assert {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}==set(m["files"])|{"SOURCE_MANIFEST.json"}
          for name,row in m["files"].items():
              raw=(root/name).read_bytes()
              assert len(raw)==row["bytes"] and hashlib.sha256(raw).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==row["git_blob"]
              if name.endswith(".py"):compile(raw,str(root/name),"exec")
          print("FROZEN_PURE_EVIDENCE_SOURCE_PASS")
          PY
      - name: Download exact immutable original and complete source continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14274528318 > "$RUNNER_TEMP/history-regex-proof/original-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14274528318/zip > "$RUNNER_TEMP/history-original-08ce.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300315992 > "$RUNNER_TEMP/history-regex-proof/filesystem-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300315992/zip > "$RUNNER_TEMP/history-filesystem-complete.zip"
      - name: Verify complete frozen source continuation
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/regex-controls-v1/read_continuation_archive.py --kind filesystem --zip "$RUNNER_TEMP/history-filesystem-complete.zip" --zip-bytes 210134590 --zip-sha256 fa523a6a9fcf2420253dd186754669fbb973160b585aee8ae38d06013eecb9cb --source-manifest-sha256 e855b02db15994d3bd015d33e246f993e249bb992baa72f9041d2785a19b9421 --output "$RUNNER_TEMP/history-filesystem-source" > "$RUNNER_TEMP/history-regex-proof/logs/source.stdout" 2> "$RUNNER_TEMP/history-regex-proof/logs/source.stderr"
          cp "$RUNNER_TEMP/history-filesystem-source/COMPLETE_READBACK.json" "$RUNNER_TEMP/history-regex-proof/SOURCE_ARCHIVE_READBACK.json"
          cp "$RUNNER_TEMP/history-filesystem-source/proof/proof/original-index.zip" "$RUNNER_TEMP/history-regex-proof/original-index.zip"
      - name: Read every original ZIP TAR index byte and restore only exact sealed config regex inputs
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/regex-controls-v1/prepare_regex.py --readback "$RUNNER_TEMP/history-filesystem-source" --zip "$RUNNER_TEMP/history-original-08ce.zip" --metadata "$RUNNER_TEMP/history-regex-proof/original-metadata.json" --output "$RUNNER_TEMP/history-regex-proof/PREPARATION.json" > "$RUNNER_TEMP/history-regex-proof/logs/preparation.stdout" 2> "$RUNNER_TEMP/history-regex-proof/logs/preparation.stderr"
      - name: Prepare only recorded Python interpreter and binary Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: -r "$RUNNER_TEMP/hia-historical-public58/tests/hia_native/python-reference-requirements.txt"
      - name: Complete unchanged fourteen refusals and six full admissions under original 180 seconds
        run: |
          timeout --signal=KILL 900 "$RUNNER_TEMP/hia-native-python/bin/python3" -I -B qualification/history_aggregate_recovery/regex-controls-v1/run_regex.py --preparation "$RUNNER_TEMP/history-regex-proof/PREPARATION.json" --output "$RUNNER_TEMP/history-regex-proof/run" > "$RUNNER_TEMP/history-regex-proof/logs/control.stdout" 2> "$RUNNER_TEMP/history-regex-proof/logs/control.stderr"
      - name: Preserve complete diagnostic streams
        if: always()
        run: |
          for stream in source.stdout source.stderr preparation.stdout preparation.stderr control.stdout control.stderr; do
            if test -f "$RUNNER_TEMP/history-regex-proof/logs/$stream"; then cat "$RUNNER_TEMP/history-regex-proof/logs/$stream"; fi
          done
          for retained in regex.process.json regex.audit.json regex.stderr; do
            if test -f "$RUNNER_TEMP/history-regex-proof/run/$retained"; then cat "$RUNNER_TEMP/history-regex-proof/run/$retained"; fi
          done
      - name: Archive complete restored input source controls and any failure
        id: archive
        if: always()
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/regex-controls-v1/export_regex.py --proof "$RUNNER_TEMP/history-regex-proof" --package "$GITHUB_WORKSPACE/qualification/history_aggregate_recovery/regex-controls-v1" --output "$RUNNER_TEMP/history-regex-export"
      - name: Preserve entire continuation archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-regex-continuation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-regex-export/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve partial owned evidence if complete archive failed
        if: always() && steps.archive.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-regex-partial-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/history-regex-proof/
            ${{ runner.temp }}/hia-historical-public58/
            ${{ runner.temp }}/hia-runtime-native/
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
