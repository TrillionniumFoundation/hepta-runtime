name: Hepta Runtime Release Build Check

on:
  pull_request:
    branches:
      - hepta-runtime-base

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-build:
    name: Rust 1.99 release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Expected source: $EXPECTED_SHA"
          echo "Checked-out source: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      # Compile the release targets without invoking packaging or publishing.
      - name: Build release binary
        shell: sh
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            docker run --rm \
              -v "$(pwd):/workspace" \
              -w /workspace \
              rust:1.99.0-alpine3.23 \
              sh -c "
                apk add --no-cache musl-dev openssl-dev openssl-libs-static pkgconfig gcc g++ protobuf-dev && \
                rustup target add ${{ matrix.target }} && \
                cargo build --locked --release --target ${{ matrix.target }}
              "
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
