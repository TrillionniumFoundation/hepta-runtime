      - name: Export and reread every success or failure capture byte
        if: always()
        run: |
          python3 -I -S -B "$P111_PACKAGE/ci/archive.py" pack --capture "$P111_RUN" --output "$P111_EXPORT" --package "$P111_PACKAGE" --manifest-sha256 "$PACKAGE_SHA256" --label connection --driver-prefix "$P111_DRIVER"
      - name: Upload complete connection evidence
