          python3 -I -S -B "$P111_PACKAGE/ci/source_check.py" --package "$P111_PACKAGE" --manifest-sha256 "$PACKAGE_SHA256" --installed-source "$GITHUB_WORKSPACE/runtime"
          test "$(git -C "$GITHUB_WORKSPACE/compiler" rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C "$GITHUB_WORKSPACE/compiler" rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
          test "$(git -C "$GITHUB_WORKSPACE/retained-sdk" rev-parse HEAD)" = b4054165e9b7be63e9309c8223d04131ec4fe31e
      - name: Install fixed native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 git binutils build-essential
      - name: Install Rust 1.95.0 only in CI
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          printf '%s\n' "RUSTUP_TOOLCHAIN=1.95.0" "P111_RUST_BIN=$(dirname "$(rustup which --toolchain 1.95.0 rustc)")" >> "$GITHUB_ENV"
          rustc +1.95.0 --version --verbose
      - name: Download this attempt's complete build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public111-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ env.P111_BUILD_ARCHIVE }}
      - name: Verify and extract every build archive member
        run: |
          python3 -I -S -B "$P111_PACKAGE/ci/archive.py" extract --archive "$P111_BUILD_ARCHIVE/capture.tar.gz" --receipt "$P111_BUILD_ARCHIVE/archive.json" --output "$P111_BUILD"
      - name: Recover the exact original get_info observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$P111_CATALOG"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14194828118/zip > "$P111_CATALOG/qualified-catalog.zip"
          python3 -I -S -B "$P111_PACKAGE/joint/authority-runner/extract_catalog_reference.py" --archive "$P111_CATALOG/qualified-catalog.zip" --output "$P111_CATALOG/selected"
      - name: Execute the complete connection domain under unchanged inner deadlines
