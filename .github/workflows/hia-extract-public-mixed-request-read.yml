name: Independent complete mixed public118 custom142 retained read
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-public-6780-20261116']
    paths: ['tests/hia_native/public118_mixed_request_read_ci/**', '.github/workflows/hia-extract-public-mixed-request-read.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LC_ALL: C.UTF-8
jobs:
  raw-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {domain: custom-legacy, artifact: 14305216777}
          - {domain: custom-modern, artifact: 14304732836}
    steps:
      - name: Checkout frozen complete archive readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public118_mixed_request_read_ci
      - name: Download the same complete terminal raw capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/extract-custom-raw-read-input"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/${{ matrix.artifact }}' > "$RUNNER_TEMP/extract-custom-raw-read-input/artifact.json"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/${{ matrix.artifact }}/zip' > "$RUNNER_TEMP/extract-custom-raw-read-input/complete.zip"
      - name: Reopen all streams and state; preserve every actual failure without execution
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/source/tests/hia_native/public118_mixed_request_read_ci/run.py" --input "$RUNNER_TEMP/extract-custom-raw-read-input/complete.zip" --output "$RUNNER_TEMP/extract-raw-read" --domain '${{ matrix.domain }}' --profile 'c57d30bfbe46376a0d8868ec5c5725687f49062960e8a686873ae91c88dac78b'
      - name: Upload complete independent reader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extract-raw-complete-read-${{ matrix.domain }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extract-raw-read/proof
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
