name: Read qualified absent-runtime actual catalog assets
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-public-6780-20261116']
    paths: ['tests/hia_native/public118_absent_catalog_read_ci/**', '.github/workflows/hia-extract-public-absent-catalog-read.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LC_ALL: C.UTF-8
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public118_absent_catalog_read_ci
      - name: Download the same qualified catalog capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/catalog-absent-input"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14201568537 > "$RUNNER_TEMP/catalog-absent-input/catalog.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14201568537/zip > "$RUNNER_TEMP/catalog-absent-input/catalog.zip"
      - name: Full original reader and actual flags-zero assets
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/source/tests/hia_native/public118_absent_catalog_read_ci/run.py" --input "$RUNNER_TEMP/catalog-absent-input" --capture "$RUNNER_TEMP/catalog-absent-capture" --output "$RUNNER_TEMP/catalog-absent-output" --profile '6f68bdd7e63e2854d6e43bd196381638fd23950874b41deadbdb8096faf50bf9'
      - name: Preserve complete readonly proof and actual assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public118-absent-catalog-read-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-absent-output
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
