name: Hepta Runtime CI

on:
  push:
    branches:
      - hepta-runtime-base
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - hepta-runtime-base

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-ci:
    name: Rust exact-head validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Descriptor-relative file safety
        run: python3 tests/file_capabilities.py

      - name: Release build
        run: cargo build --locked --release
