name: Hepta Runtime CI

on:
  push:
    branches:
      - hepta-runtime-base
      - 'feature/**'
      - 'feat/**'
      - 'codex/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-ci:
    name: Rust exact-head validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Descriptor-relative file safety
        run: python3 tests/file_capabilities.py

      - name: Control-plane regression
        run: |
          set -euo pipefail
          python3 -B tests/runtime_registry_page_tests.py
          python3 -B tests/chatgpt_v11_layered_read_tests.py
          python3 -B tests/runtime_workflow_owner_tests.py
          python3 -B tests/chatgpt_v10_single_v4_effect_tests.py
          python3 -B tests/chatgpt_v10_stream_custody_tests.py
          python3 -B tests/test_computer_http.py
          python3 -B tests/full_operator_facade_tests.py
          python3 -B tests/full_operator_cancel_tests.py
          python3 -B tests/chatgpt_request_identity_tests.py
          python3 -B tests/full_operator_session_recovery_tests.py

      - name: Release build
        run: cargo build --locked --release
