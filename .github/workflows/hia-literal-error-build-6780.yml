name: Build HIA literal error formatter from retained B3
on:
  workflow_dispatch:
  push:
    branches: [hia-literal-error-build-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      LITERAL_SOURCE: ${{ github.workspace }}/runtime/qualification/literal_error/v1/native_build
      LITERAL_MANIFEST: 546f2fd4296d44f6f8f322c387bbe3451fe53ad4c5e2520964706f36cf6f8c6f
    steps:
      - name: Checkout complete frozen production and reader source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/literal_error/v1/native_build
          persist-credentials: false
      - name: Checkout exact HIA compiler dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact frozen heads
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
      - name: Copy B3 compile once and read complete build
        run: |
          python3 -I -S -B "$LITERAL_SOURCE/scripts/gate.py" build \
            --work "$RUNNER_TEMP/literal-error-build" --hepta "$GITHUB_WORKSPACE/compiler" \
            --source-manifest-sha256 "$LITERAL_MANIFEST"
      - name: Preserve all complete or failed build bytes
        if: always()
        run: |
          python3 -I -S -B "$LITERAL_SOURCE/scripts/gate.py" export \
            --work "$RUNNER_TEMP/literal-error-build" --output "$RUNNER_TEMP/literal-error-build-export" \
            --source-manifest-sha256 "$LITERAL_MANIFEST"
      - name: Upload complete build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: literal-error-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/literal-error-build-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
