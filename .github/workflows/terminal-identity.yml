name: Native terminal identity

on:
  push:
    paths:
      - 'src/mcp/runtime/terminal_host.py'
      - 'tests/terminal_host_tests.py'
      - '.github/workflows/terminal-identity.yml'
  pull_request:
    paths:
      - 'src/mcp/runtime/terminal_host.py'
      - 'tests/terminal_host_tests.py'
      - '.github/workflows/terminal-identity.yml'

permissions:
  contents: read

jobs:
  terminal-identity:
    name: Native terminal helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Retain source and interpreter identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terminal-identity"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          /usr/bin/python3 -B - <<'PY' | tee "$RUNNER_TEMP/terminal-identity/source.json"
          import hashlib, json, platform, subprocess, sys
          from pathlib import Path
          paths = [
              "src/mcp/runtime/terminal_host.py",
              "tests/terminal_host_tests.py",
              ".github/workflows/terminal-identity.yml",
          ]
          print(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "python": sys.version,
              "python_executable": sys.executable,
              "platform": platform.platform(),
              "sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
          }, indent=2, sort_keys=True))
          PY

      - name: Run the complete native terminal regression suite
        run: |
          set -euo pipefail
          /usr/bin/python3 -B tests/terminal_host_tests.py -v 2>&1 | tee "$RUNNER_TEMP/terminal-identity/tests.log"

      - name: Confirm tested source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Retain original logs and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-identity-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-identity/
          if-no-files-found: error
          retention-days: 14
