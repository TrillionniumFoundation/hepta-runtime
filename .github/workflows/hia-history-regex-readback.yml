name: Independently read completed historical regex controls
on:
  push:
    branches: [hia-history-aggregate-readback-6780-20261117]
    paths: ['.github/workflows/hia-history-regex-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen independent reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/history_aggregate_recovery/regex-readback-v1
      - name: Verify reader source and syntax
        run: |
          mkdir -p "$RUNNER_TEMP/regex-independent-result/logs"
          echo "1f4b1fe66cacc6d6847bbb2761d50826d8d32ee8115bd19d6731249f4157e11b  qualification/history_aggregate_recovery/regex-readback-v1/SOURCE_MANIFEST.json" | sha256sum --check --strict
          timeout --signal=KILL 60 python3 -I -S -B - qualification/history_aggregate_recovery/regex-readback-v1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/"SOURCE_MANIFEST.json").read_bytes())
          assert {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}==set(m["files"])|{"SOURCE_MANIFEST.json"}
          for name,row in m["files"].items():
              raw=(root/name).read_bytes()
              assert len(raw)==row["bytes"] and hashlib.sha256(raw).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==row["git_blob"]
              compile(raw,str(root/name),"exec")
          print("COMPLETE_FROZEN_READER_SOURCE_PASS")
          PY
      - name: Download exact completed continuation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300473635 > "$RUNNER_TEMP/regex-independent-result/artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300473635/zip > "$RUNNER_TEMP/regex-input.zip"
      - name: Read complete ZIP gzip TAR and every logical byte and source
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/regex-readback-v1/read_continuation_archive.py --kind regex --zip "$RUNNER_TEMP/regex-input.zip" --zip-bytes 197561599 --zip-sha256 7101ffa134669ac3bf2f1342f09c24e2d3d1ec3af3f1e3aaa956b76ac1b28a08 --source-manifest-sha256 8ea97073a0cfeda9ea2be8f621fed3d76bb26c81d00bfc6c0f1e5c2a8ee22895 --output "$RUNNER_TEMP/regex-independent-input" > "$RUNNER_TEMP/regex-independent-result/logs/archive.stdout" 2> "$RUNNER_TEMP/regex-independent-result/logs/archive.stderr"
          cp "$RUNNER_TEMP/regex-independent-input/COMPLETE_READBACK.json" "$RUNNER_TEMP/regex-independent-result/COMPLETE_ARCHIVE_READBACK.json"
          gzip -c "$RUNNER_TEMP/regex-independent-input/COMPLETE_MEMBER_PINS.json" > "$RUNNER_TEMP/regex-independent-result/COMPLETE_MEMBER_PINS.json.gz"
      - name: Independent complete source controls process and readonly verification
        run: |
          timeout --signal=KILL 180 python3 -I -S -B qualification/history_aggregate_recovery/regex-readback-v1/verify_regex.py --readback "$RUNNER_TEMP/regex-independent-input" --output "$RUNNER_TEMP/regex-independent-result/guarded" --zip-bytes 197561599 --zip-sha256 7101ffa134669ac3bf2f1342f09c24e2d3d1ec3af3f1e3aaa956b76ac1b28a08 > "$RUNNER_TEMP/regex-independent-result/logs/reader.stdout" 2> "$RUNNER_TEMP/regex-independent-result/logs/reader.stderr"
      - name: Preserve exact diagnostics and frozen readers
        if: always()
        run: |
          cp -a qualification/history_aggregate_recovery/regex-readback-v1 "$RUNNER_TEMP/regex-independent-result/source"
          for stream in archive.stdout archive.stderr reader.stdout reader.stderr; do
            if test -f "$RUNNER_TEMP/regex-independent-result/logs/$stream"; then cat "$RUNNER_TEMP/regex-independent-result/logs/$stream"; fi
          done
      - name: Retain complete independent verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-regex-independent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regex-independent-result/
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
