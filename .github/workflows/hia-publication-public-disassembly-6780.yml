name: Existing publication object disassembly
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-public-disassembly-6780-v1-20261117']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "PD_SOURCE=$GITHUB_WORKSPACE/candidate/tests/hia_native/publication_public_disassembly_ci" "PD_READ=$RUNNER_TEMP/publication-object-read" "PD_DRIVER=$RUNNER_TEMP/publication-object-driver" "PD_EXPORT=$RUNNER_TEMP/publication-object-export" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_public_disassembly_ci
      - name: Complete existing archive and actual object instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B "$PD_SOURCE/disassemble.py" --output "$PD_READ" > "$PD_DRIVER.stdout" 2> "$PD_DRIVER.stderr"
          cat "$PD_DRIVER.stdout"
      - name: Preserve complete proof or reader failure
        if: always()
        run: |
          python3 -I -S -B "$PD_SOURCE/build-reference/archive.py" pack --source "$PD_SOURCE" --capture "$PD_READ/proof" --output "$PD_EXPORT" --driver-prefix "$PD_DRIVER"
          python3 -I -S -B -c 'import os,pathlib; p=pathlib.Path(os.environ["PD_DRIVER"]+".stderr"); print(p.read_text() if p.exists() else "")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-object-read-${{ github.sha }}
          path: ${{ env.PD_EXPORT }}
          compression-level: 0
          if-no-files-found: error
