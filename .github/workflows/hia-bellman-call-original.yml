name: Bellman full original caller reference
on:
  push:
    branches: [hia-bellman-call-6780-20261116]
    paths:
      - 'tests/hia_native/bellman_call_ci/**'
      - '.github/workflows/hia-bellman-call-original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tests/hia_native/bellman_call_ci
      - name: Verify source identity and install the exact original compiler
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.95.0 --profile minimal
      - name: Execute unchanged Deserialize and complete plan on all 683 inputs
        run: |
          python3 -I -B runtime/tests/hia_native/bellman_call_ci/observe_full_original.py --output "$RUNNER_TEMP/bellman-call-original"
      - name: Archive complete source, crate bytes and process streams
        if: always()
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          root=Path(os.environ['RUNNER_TEMP'])/'bellman-call-original'
          output=Path(os.environ['RUNNER_TEMP'])/'bellman-call-original-artifact';output.mkdir()
          assert root.is_dir()
          inventory={p.relative_to(root).as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file()}
          (root/'artifact-manifest.json').write_text(json.dumps({'files':inventory},indent=2,sort_keys=True)+'\n')
          archive=output/'original.tar.gz'
          with tarfile.open(archive,'w:gz') as t:t.add(root,arcname='original',recursive=True)
          raw=archive.read_bytes()
          (output/'archive.json').write_text(json.dumps({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'files':len(inventory),'logical_file_bytes':sum(v['bytes'] for v in inventory.values()),'whole_runtime_replaced':False,'public_handler_qualified':False},sort_keys=True,indent=2)+'\n')
          PY
      - name: Retain complete original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bellman-call-original-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bellman-call-original-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
