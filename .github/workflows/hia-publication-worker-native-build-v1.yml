name: Fresh private publication worker capability build
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-worker-native-build-6780-v1-20261117']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set actual runner paths
        run: |
          printf '%s\n' "PW_SOURCE=$GITHUB_WORKSPACE/runtime/tests/hia_native/publication_worker_native_ci/source" "PW_RUN=$RUNNER_TEMP/publication-native-build" "PW_EXPORT=$RUNNER_TEMP/publication-native-export" "PW_DRIVER=$RUNNER_TEMP/publication-native-driver" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_worker_native_ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Fresh six HIA builds and native prefix with complete passive controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PW_SOURCE/recipe/entry.py" build --hepta "$GITHUB_WORKSPACE/compiler" --output "$PW_RUN" > "$PW_DRIVER.stdout" 2> "$PW_DRIVER.stderr"
      - name: Retain every complete success or failure byte
        if: always()
        run: |
          python3 -I -S -B "$PW_SOURCE/recipe/archive.py" pack --source "$PW_SOURCE" --capture "$PW_RUN" --output "$PW_EXPORT" --driver-prefix "$PW_DRIVER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publisher-native-build-${{ github.sha }}
          path: ${{ env.PW_EXPORT }}
          compression-level: 0
          if-no-files-found: error
  uploaded-read:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set actual reader paths
        run: |
          printf '%s\n' "PW_SOURCE=$GITHUB_WORKSPACE/runtime/tests/hia_native/publication_worker_native_ci/source" "PW_WORK=$RUNNER_TEMP/publication-native-reread" "PW_PROOF=$RUNNER_TEMP/publication-native-proof" "PW_EXPORT=$RUNNER_TEMP/publication-native-proof-export" "PW_DRIVER=$RUNNER_TEMP/publication-native-proof-driver" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_worker_native_ci
      - name: Entire uploaded archive and independently guarded read
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PW_SOURCE/recipe/read_uploaded.py" --run "${{ github.run_id }}" --head "${{ github.sha }}" --artifact-name "publisher-native-build-${{ github.sha }}" --work "$PW_WORK" --output "$PW_PROOF" > "$PW_DRIVER.stdout" 2> "$PW_DRIVER.stderr"
      - name: Preserve complete passive proof
        if: always()
        run: |
          python3 -I -S -B "$PW_SOURCE/recipe/archive.py" pack --source "$PW_SOURCE" --capture "$PW_PROOF" --output "$PW_EXPORT" --driver-prefix "$PW_DRIVER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publisher-native-build-read-${{ github.sha }}
          path: ${{ env.PW_EXPORT }}
          compression-level: 0
          if-no-files-found: error
