name: Independently read complete uploaded native binary diagnostic evidence
on:
  workflow_dispatch:
  push:
    branches: [hia-parent-directory-diagnostic-fixed-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      BINARY_SOURCE: ${{ github.workspace }}/runtime/qualification/parent_directory/v1/diagnostic_fixed
      BINARY_MANIFEST: 49c5c2d2d6c36f271cd781db26827f9c4f810ab0666d3db4e6f402535ef361c9
    steps:
      - name: Checkout frozen independent uploaded reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/parent_directory/v1/diagnostic_fixed
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Independently read all uploaded bytes without application execution
        run: |
          python3 -I -S -B "$BINARY_SOURCE/driver.py" run \
            --work "$RUNNER_TEMP/parent-directory-diagnostic-fixed-uploaded" --source-manifest-sha256 "$BINARY_MANIFEST"
      - name: Retain complete evidence including any failed capture
        if: always()
        run: |
          python3 -I -S -B "$BINARY_SOURCE/driver.py" export \
            --work "$RUNNER_TEMP/parent-directory-diagnostic-fixed-uploaded" --output "$RUNNER_TEMP/parent-directory-diagnostic-fixed-uploaded-export" \
            --source-manifest-sha256 "$BINARY_MANIFEST"
      - name: Upload all captured bytes and process receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parent-directory-diagnostic-fixed-uploaded-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parent-directory-diagnostic-fixed-uploaded-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
