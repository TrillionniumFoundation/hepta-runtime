name: Read retained publisher concurrent completion order without replay
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-concurrent-order-read-6780-v1-20261117']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set exact runtime paths
        run: |
          printf '%s\n' "PI_SOURCE=$GITHUB_WORKSPACE/candidate/qualification/publication_concurrent_order_read_v1" "PI_RETAINED=$GITHUB_WORKSPACE/retained/tests/hia_native/publication_duplex_capture_v3" "PI_BUILD=$GITHUB_WORKSPACE/build-recipe/tests/hia_native/publication_duplex_build_v3" "PI_CAPTURE=$RUNNER_TEMP/publication-order-read" "PI_RESTORE=$RUNNER_TEMP/publication-order-retained" "PI_EXPORT=$RUNNER_TEMP/publication-order-read-export" "PI_DRIVER=$RUNNER_TEMP/publication-order-read-driver" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/publication_concurrent_order_read_v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: retained
          ref: aee78d9237a5878c9d4ec316bca3c612acf8f3de
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_duplex_capture_v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-recipe
          ref: f4a348f6661aec513ac63e1807ff697e81704b3e
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_duplex_build_v3
      - name: Read every uploaded archive byte and complete actual response order and SDK source
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PI_SOURCE/inspect.py" --retained "$PI_RETAINED" --build-recipe "$PI_BUILD" --output "$PI_CAPTURE" --restored "$PI_RESTORE" > "$PI_DRIVER.stdout" 2> "$PI_DRIVER.stderr"
          cat "$PI_DRIVER.stdout"
      - name: Preserve complete pure diagnostic or failure
        if: always()
        run: |
          python3 -I -S -B "$PI_RETAINED/archive.py" pack --source "$PI_SOURCE" --capture "$PI_CAPTURE" --output "$PI_EXPORT" --driver-prefix "$PI_DRIVER"
          cat "$PI_DRIVER.stderr"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-concurrent-order-read-${{ github.sha }}
          path: ${{ env.PI_EXPORT }}
          compression-level: 0
          if-no-files-found: error
