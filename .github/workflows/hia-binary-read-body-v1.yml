name: Qualify actual native binary read and fingerprint
on:
  workflow_dispatch:
  push:
    branches: [hia-binary-read-body-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      BINARY_SOURCE: ${{ github.workspace }}/runtime/qualification/binary_read_body/v1/source
      BINARY_MANIFEST: 6f12f31515677ed499eb53b1d99afd17d9a1d768243d46735418a18ff3f08114
    steps:
      - name: Checkout frozen actual filesystem qualification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/binary_read_body/v1/source
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run original and native immutable filesystem domain
        run: |
          python3 -I -S -B "$BINARY_SOURCE/scripts/driver.py" run \
            --work "$RUNNER_TEMP/binary-read-body" --source-manifest-sha256 "$BINARY_MANIFEST"
      - name: Retain complete evidence including any failed capture
        if: always()
        run: |
          python3 -I -S -B "$BINARY_SOURCE/scripts/driver.py" export \
            --work "$RUNNER_TEMP/binary-read-body" --output "$RUNNER_TEMP/binary-read-body-export" \
            --source-manifest-sha256 "$BINARY_MANIFEST"
      - name: Upload all captured bytes and process receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-read-body-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary-read-body-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
