name: Join complete retained history aggregate and pending controls
on:
  push:
    branches: [hia-history-aggregate-readback-6780-20261117]
    paths: ['.github/workflows/hia-history-final-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen final proof join
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/history_aggregate_recovery/final-readback-v1
      - name: Verify all exact source and plan bytes before execution
        run: |
          mkdir -p "$RUNNER_TEMP/history-final-result/inputs" "$RUNNER_TEMP/history-final-result/logs"
          echo "613dafdec83caeb627abe405455b3ae71f886098481e9940960a15e942beb8cb  qualification/history_aggregate_recovery/final-readback-v1/SOURCE_MANIFEST.json" | sha256sum --check --strict
          timeout --signal=KILL 60 python3 -I -S -B - qualification/history_aggregate_recovery/final-readback-v1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/"SOURCE_MANIFEST.json").read_bytes())
          assert {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}==set(m["files"])|{"SOURCE_MANIFEST.json"}
          for name,row in m["files"].items():
              raw=(root/name).read_bytes()
              assert len(raw)==row["bytes"] and hashlib.sha256(raw).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==row["git_blob"]
              if name.endswith(".py"):compile(raw,str(root/name),"exec")
              else:json.loads(raw)
          print("COMPLETE_FROZEN_FINAL_JOIN_SOURCE_PASS")
          PY
      - name: Retrieve the three exact completed independent readback artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300358256 > "$RUNNER_TEMP/history-final-result/inputs/aggregate-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/runs/44020501712/jobs?filter=latest > "$RUNNER_TEMP/history-final-result/inputs/aggregate-jobs.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300358256/zip > "$RUNNER_TEMP/history-final-result/inputs/aggregate.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300661666 > "$RUNNER_TEMP/history-final-result/inputs/filesystem-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/runs/44019797104/jobs?filter=latest > "$RUNNER_TEMP/history-final-result/inputs/filesystem-jobs.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300661666/zip > "$RUNNER_TEMP/history-final-result/inputs/filesystem.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300484402 > "$RUNNER_TEMP/history-final-result/inputs/regex-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/runs/44021637927/jobs?filter=latest > "$RUNNER_TEMP/history-final-result/inputs/regex-jobs.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14300484402/zip > "$RUNNER_TEMP/history-final-result/inputs/regex.zip"
      - name: Join every complete proof under the unchanged read-only guard
        run: |
          timeout --signal=KILL 180 python3 -I -S -B qualification/history_aggregate_recovery/final-readback-v1/join_history.py --inputs "$RUNNER_TEMP/history-final-result/inputs" --output "$RUNNER_TEMP/history-final-result/guarded" > "$RUNNER_TEMP/history-final-result/logs/reader.stdout" 2> "$RUNNER_TEMP/history-final-result/logs/reader.stderr"
      - name: Preserve all original proof bytes and current diagnostics
        if: always()
        run: |
          cp -a qualification/history_aggregate_recovery/final-readback-v1 "$RUNNER_TEMP/history-final-result/source"
          for stream in reader.stdout reader.stderr; do
            if test -f "$RUNNER_TEMP/history-final-result/logs/$stream"; then cat "$RUNNER_TEMP/history-final-result/logs/$stream"; fi
          done
      - name: Retain complete final joined readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-final-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-final-result/
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
