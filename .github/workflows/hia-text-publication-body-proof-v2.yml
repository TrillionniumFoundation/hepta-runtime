name: Independently read all private publication body evidence
on:
  workflow_dispatch:
  push:
    branches: ['hia-text-publication-body-proof-6780-v2-20261117']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  complete-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime variables
        run: |
          printf '%s\n' "BODY_PROOF=$RUNNER_TEMP/text-publication-body-independent-proof-v2" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/text_publication_body_proof_v2
      - name: Verify immutable ZIPs, every TAR member and the complete pure-reader proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(sha256sum qualification/text_publication_body_proof_v2/read_archives.py | cut -d' ' -f1)" = 24303dc02d126c463c2d068ef20c0a18d405b78bf33ecc121f309894f7c298ba
          python3 -I -S -B qualification/text_publication_body_proof_v2/read_archives.py --output "$BODY_PROOF"
      - name: Preserve complete archive indices and readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-publication-body-independent-proof-${{ github.sha }}
          path: ${{ env.BODY_PROOF }}/result
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
