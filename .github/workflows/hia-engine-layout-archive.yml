name: Independent complete engine layout archive read
on:
  workflow_dispatch:
  push:
    branches: [hia-engine-layout-archive-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  complete-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LAYOUT_ZIP_SOURCE: ${{ github.workspace }}/runtime/qualification/runtime_engine_layout/v1/archive_reader
      LAYOUT_ZIP_SHA: a91d1576bcde71e20157d197dd099325914b1f0faff16c63fcb05bbfe52039b8
    steps:
      - name: Checkout fixed inert reader and exact archive binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/runtime_engine_layout/v1/archive_reader
          persist-credentials: false
      - name: Bind the owned temporary output directory
        run: |
          printf 'LAYOUT_ZIP_OUTPUT=%s\n' "$RUNNER_TEMP/engine-layout-complete-zip" >> "$GITHUB_ENV"
      - name: Verify all frozen reader bytes before reading the artifact
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B - <<'PY'
          import os,sys,shutil
          from pathlib import Path
          root=Path(os.environ['LAYOUT_ZIP_SOURCE']);sys.path.insert(0,str(root))
          import archive_reader
          assert archive_reader.identity()==os.environ['LAYOUT_ZIP_SHA']
          for path in root.rglob('*.py'):compile(path.read_bytes(),str(path),'exec')
          shutil.copytree(root,Path(os.environ['LAYOUT_ZIP_OUTPUT'])/'source')
          PY
      - name: Fetch exact complete ZIP without target execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B "$LAYOUT_ZIP_SOURCE/driver.py" fetch --work "$LAYOUT_ZIP_OUTPUT" --source-manifest-sha256 "$LAYOUT_ZIP_SHA"
      - name: Read every ZIP, TAR, logical file, physical snapshot and retained guard
        run: |
          python3 -I -B "$LAYOUT_ZIP_SOURCE/driver.py" read --work "$LAYOUT_ZIP_OUTPUT" --source-manifest-sha256 "$LAYOUT_ZIP_SHA"
      - name: Preserve complete read-only proof and process streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-layout-complete-zip-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/engine-layout-complete-zip/FETCH.json
            ${{ runner.temp }}/engine-layout-complete-zip/READ.json
            ${{ runner.temp }}/engine-layout-complete-zip/source
            ${{ runner.temp }}/engine-layout-complete-zip/fetch-processes
            ${{ runner.temp }}/engine-layout-complete-zip/read-processes
          if-no-files-found: error
          retention-days: 30
