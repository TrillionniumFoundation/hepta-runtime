name: Hepta Runtime runner bootstrap (non-authorizing)

on:
  pull_request:
    branches:
      - hepta-runtime-base
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/runtime-bootstrap.yml"
      - "scripts/test_runtime_ci_contract.py"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-bootstrap:
    name: Exact-source runner and CI-contract smoke
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate runner identity and source-only CI contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 --version
          python3 -m unittest discover -s scripts -p 'test_runtime_ci_contract.py' -v
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
