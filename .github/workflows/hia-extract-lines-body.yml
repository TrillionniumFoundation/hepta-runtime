name: Complete HIA Local extract_lines body
on:
  workflow_dispatch:
  push:
    branches: [hia-extract-lines-local-6780-20261116]
permissions:
  contents: read
jobs:
  local-extract-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      EXTRACT_SOURCE: ${{ github.workspace }}/runtime/tests/hia_native/extract_lines_ci/source
      EXTRACT_SOURCE_SHA: ab117630de23d39dec8f909afba5460690c04fd2ed0e7f351ba65903fbf198b0
    steps:
      - name: Checkout frozen candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: tests/hia_native/extract_lines_ci/source
          persist-credentials: false
      - name: Checkout exact HIA compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source and compiler identities
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
          python3 -I -B - <<'PY'
          import os,sys
          from pathlib import Path
          source=Path(os.environ['EXTRACT_SOURCE'])
          sys.path.insert(0,str(source))
          from common import source as verify_source
          assert verify_source()==os.environ['EXTRACT_SOURCE_SHA']
          for path in source.rglob('*.py'):
              compile(path.read_bytes(),str(path),'exec')
          PY
      - name: Install exact test toolchain and native compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 git binutils build-essential
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          printf 'EXTRACT_RUST_BIN=%s\n' "$(dirname "$(rustup which --toolchain 1.95.0 rustc)")" >> "$GITHUB_ENV"
      - name: Execute every actual original/native pair and shared-wait control
        run: |
          python3 -I -B "$EXTRACT_SOURCE/run_gate.py" --hepta "$GITHUB_WORKSPACE/compiler" --rust-bin "$EXTRACT_RUST_BIN" --output "$RUNNER_TEMP/extract-lines-body-output" --source-manifest-sha256 "$EXTRACT_SOURCE_SHA"
      - name: Independently read complete evidence within the original budget
        run: |
          python3 -I -B - <<'PY'
          import json,os,sys
          from pathlib import Path
          source=Path(os.environ['EXTRACT_SOURCE'])
          sys.path.insert(0,str(source))
          from process import Recorder
          temporary=Path(os.environ['RUNNER_TEMP'])
          recorder=Recorder(source,temporary/'extract-lines-body-independent')
          raw,row=recorder.run('independent-reader',[sys.executable,'-I','-B',source/'verify_readonly.py',
              '--output',temporary/'extract-lines-body-output','--source-manifest-sha256',os.environ['EXTRACT_SOURCE_SHA'],
              '--require-controls'],timeout=180)
          proof=json.loads(raw)
          assert proof['before']==proof['after'] and len(proof['probes'])==12
          assert proof['native_or_rust_executions']==proof['reader_writes']==0
          print(json.dumps({'status':proof['evidence']['status'],'stdout':row['stdout']},sort_keys=True))
          PY
      - name: Report failure location without replay
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'extract-lines-body-output'
          for path in [root/'GATE.json',*sorted(root.rglob('*.stderr'))]:
              if path.is_file():
                  raw=path.read_bytes()
                  if raw:
                      print(json.dumps({'file':str(path.relative_to(root)),'bytes':len(raw),
                          'sha256':hashlib.sha256(raw).hexdigest(),'tail_utf8':raw[-16384:].decode('utf-8',errors='replace'),
                          'complete_bytes_retained':True},sort_keys=True))
          PY
      - name: Preserve complete success or failure without replay
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/extract-lines-body-output"
          python3 -I -B "$EXTRACT_SOURCE/export.py" --capture "$RUNNER_TEMP/extract-lines-body-output" --archive "$RUNNER_TEMP/extract-lines-body.tar.gz" > "$RUNNER_TEMP/extract-lines-body-export.stdout" 2> "$RUNNER_TEMP/extract-lines-body-export.stderr"
      - name: Upload complete source and physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extract-lines-body-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/extract-lines-body.tar.gz
            ${{ runner.temp }}/extract-lines-body.tar.gz.json
            ${{ runner.temp }}/extract-lines-body-independent
            ${{ runner.temp }}/extract-lines-body-export.stdout
            ${{ runner.temp }}/extract-lines-body-export.stderr
          if-no-files-found: error
          retention-days: 14
