name: Pure archive publisher parallel read continuation
on:
  push:
    branches: [hia-audit-anchor-publish-read-v4-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tests/hia_native/audit_anchor_publish_read_v4
      - name: Verify exact new pure-reader source before execution
        run: |
          mkdir "$RUNNER_TEMP/publish-read"
          cp -a tests/hia_native/audit_anchor_publish_read_v4 "$RUNNER_TEMP/publish-read/source"
          python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"publish-read/source";raw=(r/"SOURCE.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="b0a66055d57fcb708b3d0b90d0d75a634d5950e5f3cf697622c6e26eff63db85"
          for p,pin in json.loads(raw)["files"].items():
              b=(r/p).read_bytes();assert len(b)==pin["bytes"] and hashlib.sha256(b).hexdigest()==pin["sha256"]
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()==pin["git_blob"]
              if p.endswith(".py"):compile(b,str(r/p),"exec")
          PY
      - name: Download exact complete failed physical-read artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14332539153/zip > "$RUNNER_TEMP/publish-read/original.zip"
      - name: Restore all 14GB logical evidence with full byte and mode readback
        run: |
          timeout --signal=KILL 180 python3 -I -B "$RUNNER_TEMP/publish-read/source/restore.py" --archive "$RUNNER_TEMP/publish-read/original.zip" --output "$RUNNER_TEMP/publish-read/restored" --pins "$RUNNER_TEMP/publish-read/source/PINS.json"
          mkdir "$RUNNER_TEMP/publish-read/restoration-proof"
          cp "$RUNNER_TEMP/publish-read/restored/RESTORE.json" "$RUNNER_TEMP/publish-read/restored/artifact-manifest.json" "$RUNNER_TEMP/publish-read/restored/exporter.json" "$RUNNER_TEMP/publish-read/restoration-proof/"
      - name: Prove exact unchanged verifier and complete disjoint row coverage
        run: timeout --signal=KILL 60 python3 -I -B "$RUNNER_TEMP/publish-read/source/source_check.py" --complete "$RUNNER_TEMP/publish-read/restored/complete"
      - name: Two bounded pure readers preserve all original checks
        run: python3 -I -B "$RUNNER_TEMP/publish-read/source/run.py" --complete "$RUNNER_TEMP/publish-read/restored/complete" --output "$RUNNER_TEMP/publish-read/output" --phase read
      - name: Guarded full byte and actual process-custody join
        run: python3 -I -B "$RUNNER_TEMP/publish-read/source/run.py" --complete "$RUNNER_TEMP/publish-read/restored/complete" --output "$RUNNER_TEMP/publish-read/output" --phase verify
      - name: Preserve complete original failure and actual continuation result
        if: always()
        run: timeout --signal=KILL 180 python3 -I -B "$RUNNER_TEMP/publish-read/source/export.py" --workspace "$RUNNER_TEMP/publish-read" --archive "$RUNNER_TEMP/publish-read/audit-publisher-read-v4.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-anchor-publisher-read-v4
          path: |
            ${{ runner.temp }}/publish-read/audit-publisher-read-v4.tar.gz
            ${{ runner.temp }}/publish-read/audit-publisher-read-v4.tar.gz.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
