name: Build native borrowed-parent file info callable
on:
  workflow_dispatch:
  push:
    branches: [hia-file-info-at-native-build-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  source-author:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      INFO_SOURCE: ${{ github.workspace }}/runtime/qualification/file_info_at/v1/native_build
      INFO_MANIFEST: 50cf29491d16f60ec32b13bf18398659436f3dc4846629c7bf9c2a37432b2d10
    steps:
      - name: Checkout frozen source author
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/file_info_at/v1/native_build
          persist-credentials: false
      - name: Checkout exact HIA source tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source heads
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
      - name: Build fixed callable and independently read all build bytes
        run: |
          python3 -I -S -B "$INFO_SOURCE/scripts/build_gate.py" build \
            --work "$RUNNER_TEMP/file-info-at-callable-build" --hepta "$GITHUB_WORKSPACE/compiler" \
            --source-manifest-sha256 "$INFO_MANIFEST"
      - name: Retain a complete archive even if native build admission failed
        if: always()
        run: |
          python3 -I -S -B "$INFO_SOURCE/scripts/build_gate.py" export \
            --work "$RUNNER_TEMP/file-info-at-callable-build" --output "$RUNNER_TEMP/file-info-at-callable-build-export" \
            --source-manifest-sha256 "$INFO_MANIFEST"
      - name: Upload complete build archive and all process streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-info-at-callable-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/file-info-at-callable-build-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
