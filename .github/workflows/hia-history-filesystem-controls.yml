name: Complete pending historical filesystem evidence controls
on:
  push:
    branches: [hia-history-aggregate-readback-6780-20261117]
    paths: ['.github/workflows/hia-history-filesystem-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen continuation source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            qualification/history_aggregate_recovery/filesystem-controls-v1
      - name: Check complete source pins and Python syntax without running evidence
        run: |
          mkdir -p "$RUNNER_TEMP/history-filesystem-proof/logs"
          echo "e855b02db15994d3bd015d33e246f993e249bb992baa72f9041d2785a19b9421  qualification/history_aggregate_recovery/filesystem-controls-v1/SOURCE_MANIFEST.json" | sha256sum --check --strict
          timeout --signal=KILL 60 python3 -I -S -B - qualification/history_aggregate_recovery/filesystem-controls-v1 <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);manifest=json.loads((root/"SOURCE_MANIFEST.json").read_bytes())
          assert {p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}==set(manifest["files"])|{"SOURCE_MANIFEST.json"}
          for name,row in manifest["files"].items():
              raw=(root/name).read_bytes()
              assert len(raw)==row["bytes"] and hashlib.sha256(raw).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==row["git_blob"]
              if name.endswith(".py"):compile(raw,str(root/name),"exec")
          print(json.dumps({"status":"SOURCE_AND_SYNTAX_PASS","source_files":len(manifest["files"]),"native_or_rust_executions":0}))
          PY
      - name: Download exact retained failed proof and original index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14298019630 > "$RUNNER_TEMP/history-filesystem-proof/failed-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14298019630/zip > "$RUNNER_TEMP/history-filesystem-proof/failed-input.zip"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14276342887 > "$RUNNER_TEMP/history-filesystem-proof/index-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14276342887/zip > "$RUNNER_TEMP/history-filesystem-proof/original-index.zip"
      - name: Reopen every retained archive byte and exact complete original report
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/filesystem-controls-v1/read_proof_archive_v2.py --zip "$RUNNER_TEMP/history-filesystem-proof/failed-input.zip" --zip-bytes 60667950 --zip-sha256 92f1a5e72db1e982b2b237084b4423aaa1204f045e5050960626f54ef5533798 --source-manifest-sha256 ef304f1000a49279bf1f51c8088ee27220e145c6564c020a2abd3116e7ea3b32 --output "$RUNNER_TEMP/history-v10-extracted" > "$RUNNER_TEMP/history-filesystem-proof/logs/archive.stdout" 2> "$RUNNER_TEMP/history-filesystem-proof/logs/archive.stderr"
          cp "$RUNNER_TEMP/history-v10-extracted/COMPLETE_READBACK.json" "$RUNNER_TEMP/history-filesystem-proof/V10_COMPLETE_READBACK.json"
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/filesystem-controls-v1/read_original_index.py --zip "$RUNNER_TEMP/history-filesystem-proof/original-index.zip" --output "$RUNNER_TEMP/history-original-index" > "$RUNNER_TEMP/history-filesystem-proof/logs/index.stdout" 2> "$RUNNER_TEMP/history-filesystem-proof/logs/index.stderr"
      - name: Restore the exact complete filesystem subset at its recorded paths
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/filesystem-controls-v1/prepare_filesystem.py --readback "$RUNNER_TEMP/history-v10-extracted" --original-report "$RUNNER_TEMP/history-original-index/original-result.json" --output "$RUNNER_TEMP/history-filesystem-proof/PREPARATION.json" > "$RUNNER_TEMP/history-filesystem-proof/logs/preparation.stdout" 2> "$RUNNER_TEMP/history-filesystem-proof/logs/preparation.stderr"
      - name: Prepare only the recorded Python interpreter and Python requirements
        run: |
          python3 -m venv "$RUNNER_TEMP/hia-native-python"
          "$RUNNER_TEMP/hia-native-python/bin/python" -m pip install --only-binary=:all: -r "$RUNNER_TEMP/hia-historical-public58/tests/hia_native/python-reference-requirements.txt"
      - name: Complete every filesystem control with the original 180-second child budget
        run: |
          timeout --signal=KILL 900 "$RUNNER_TEMP/hia-native-python/bin/python3" -I -B qualification/history_aggregate_recovery/filesystem-controls-v1/run_filesystem.py --preparation "$RUNNER_TEMP/history-filesystem-proof/PREPARATION.json" --output "$RUNNER_TEMP/history-filesystem-proof/run" > "$RUNNER_TEMP/history-filesystem-proof/logs/control.stdout" 2> "$RUNNER_TEMP/history-filesystem-proof/logs/control.stderr"
      - name: Preserve actual complete control and observer diagnostics
        if: always()
        run: |
          for stream in archive.stdout archive.stderr index.stdout index.stderr preparation.stdout preparation.stderr control.stdout control.stderr; do
            if test -f "$RUNNER_TEMP/history-filesystem-proof/logs/$stream"; then cat "$RUNNER_TEMP/history-filesystem-proof/logs/$stream"; fi
          done
          for retained in filesystem.process.json filesystem.audit.json filesystem.stderr filesystem-reader-calls.jsonl; do
            if test -f "$RUNNER_TEMP/history-filesystem-proof/run/$retained"; then cat "$RUNNER_TEMP/history-filesystem-proof/run/$retained"; fi
          done
      - name: Archive all inputs source controls and failure bytes
        id: archive
        if: always()
        run: |
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/filesystem-controls-v1/export_filesystem.py --proof "$RUNNER_TEMP/history-filesystem-proof" --package "$GITHUB_WORKSPACE/qualification/history_aggregate_recovery/filesystem-controls-v1" --output "$RUNNER_TEMP/history-filesystem-export"
      - name: Retain complete continuation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-filesystem-continuation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-filesystem-export/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw diagnostics if complete archival failed
        if: always() && steps.archive.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-filesystem-partial-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/history-filesystem-proof/
            ${{ runner.temp }}/hia-historical-public58/
            ${{ runner.temp }}/hia-runtime-native/
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
