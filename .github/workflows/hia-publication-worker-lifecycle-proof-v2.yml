name: Read complete successful publication worker lifecycle proof
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-worker-lifecycle-proof-6780-v2-20261117']
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: qualification/publication_worker_lifecycle_proof_v2
      - name: Read every retained proof byte without any application
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/runtime/qualification/publication_worker_lifecycle_proof_v2/read_proof.py" --output "$RUNNER_TEMP/publisher-lifecycle-proof" > "$RUNNER_TEMP/publisher-lifecycle-proof.stdout" 2> "$RUNNER_TEMP/publisher-lifecycle-proof.stderr"
          cat "$RUNNER_TEMP/publisher-lifecycle-proof.stdout"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publisher-lifecycle-complete-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/publisher-lifecycle-proof
            ${{ runner.temp }}/publisher-lifecycle-proof.stdout
            ${{ runner.temp }}/publisher-lifecycle-proof.stderr
          compression-level: 0
          if-no-files-found: error
