name: Read retained namespace original compilation without replay
on:
  push:
    branches: [hia-namespace-versions-original-recovery-v3-6780-20261118]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Freeze all recovery source bytes before any reading
        shell: bash
        run: |
          set -euo pipefail
          NAMESPACE_RECOVERY_ROOT="$RUNNER_TEMP/namespace-versions-original-recovery-v3"
          printf 'NAMESPACE_RECOVERY_ROOT=%s\n' "$NAMESPACE_RECOVERY_ROOT" >> "$GITHUB_ENV"
          mkdir "$NAMESPACE_RECOVERY_ROOT"
          cp -a qualification/namespace_versions/v1/original_recovery_v3 "$NAMESPACE_RECOVERY_ROOT/source"
          mkdir "$NAMESPACE_RECOVERY_ROOT/outer"
          python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"namespace-versions-original-recovery-v3/source"
          raw=(r/"SOURCE_MANIFEST.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="2d86225139bd3e7b0fc82eaa53a93939747bbcf4cbac3e1873b0a4edd8e1a3bd"
          m=json.loads(raw)
          assert {p.relative_to(r).as_posix()for p in r.rglob("*")if p.is_file()}=={x["path"]for x in m["files"]}|{"SOURCE_MANIFEST.json"}
          for row in m["files"]:
              b=(r/row["path"]).read_bytes()
              assert len(b)==row["bytes"]and hashlib.sha256(b).hexdigest()==row["sha256"]
              assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()==row["git_blob"]
              if row["path"].endswith(".py"):compile(b,str(r/row["path"]),"exec")
          PY
      - name: Read the complete uploaded original build without application execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B "$NAMESPACE_RECOVERY_ROOT/source/gate.py" \
            --workspace "$NAMESPACE_RECOVERY_ROOT" \
            > "$NAMESPACE_RECOVERY_ROOT/outer/read.stdout" 2> "$NAMESPACE_RECOVERY_ROOT/outer/read.stderr"
      - name: Preserve actual recovery streams
        if: always()
        shell: bash
        run: |
          if test -f "$NAMESPACE_RECOVERY_ROOT/outer/read.stdout"; then cat "$NAMESPACE_RECOVERY_ROOT/outer/read.stdout"; fi
          if test -f "$NAMESPACE_RECOVERY_ROOT/outer/read.stderr"; then cat "$NAMESPACE_RECOVERY_ROOT/outer/read.stderr"; fi
      - name: Archive and reread every retained original and recovery byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 180 python3 -I -B "$NAMESPACE_RECOVERY_ROOT/source/export.py" \
            --workspace "$NAMESPACE_RECOVERY_ROOT" --archive "$RUNNER_TEMP/namespace-versions-original-recovery-v3.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespace-versions-original-recovery-v3
          path: |
            ${{ runner.temp }}/namespace-versions-original-recovery-v3.tar.gz
            ${{ runner.temp }}/namespace-versions-original-recovery-v3.tar.gz.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
