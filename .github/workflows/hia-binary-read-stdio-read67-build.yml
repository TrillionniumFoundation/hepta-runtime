name: Build binary read stdio with qualified pool and formatter34
on:
  workflow_dispatch:
  push:
    branches: [hia-binary-read-stdio-read67-build-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  source-author:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      STDIO_SOURCE: ${{ github.workspace }}/runtime/qualification/binary_read_stdio/v2/read67_build
      STDIO_MANIFEST: 3cf006886918325e777aa2a960de7d68073a0f13033a6eccf8f92824bb1be02b
    steps:
      - name: Checkout frozen source author
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/binary_read_stdio/v2/read67_build
          persist-credentials: false
      - name: Checkout exact HIA source tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source heads
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
      - name: Build fixed callable and independently read all build bytes
        run: |
          python3 -I -S -B "$STDIO_SOURCE/scripts/build_gate.py" build \
            --work "$RUNNER_TEMP/binary-read-stdio-read67-build" --hepta "$GITHUB_WORKSPACE/compiler" \
            --source-manifest-sha256 "$STDIO_MANIFEST"
      - name: Retain a complete archive even if native build admission failed
        if: always()
        run: |
          python3 -I -S -B "$STDIO_SOURCE/scripts/build_gate.py" export \
            --work "$RUNNER_TEMP/binary-read-stdio-read67-build" --output "$RUNNER_TEMP/binary-read-stdio-read67-build-export" \
            --source-manifest-sha256 "$STDIO_MANIFEST"
      - name: Upload complete build archive and all process streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-read-stdio-read67-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary-read-stdio-read67-build-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
