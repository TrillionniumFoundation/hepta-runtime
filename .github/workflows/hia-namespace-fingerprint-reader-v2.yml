name: Read complete namespace fingerprint evidence
on:
  push:
    branches: [hia-namespace-fingerprint-reader-v2-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tests/hia_native/namespace_fingerprint_reader_v2
      - name: Freeze and admit the pure reader
        run: |
          mkdir "$RUNNER_TEMP/fingerprint-reader"
          cp -a tests/hia_native/namespace_fingerprint_reader_v2 "$RUNNER_TEMP/fingerprint-reader/source"
          python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"fingerprint-reader/source"
          raw=(r/"SOURCE.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="669047017945b1b27ad8e5960dff6bbbdb4a1e5ea757665105ea1d4a9fb8d701"
          for p,pin in json.loads(raw)["files"].items():
              b=(r/p).read_bytes();assert len(b)==pin["bytes"] and hashlib.sha256(b).hexdigest()==pin["sha256"]
              if p.endswith(".py"): compile(b,str(r/p),"exec")
          PY
      - name: Download the exact complete producer archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14340924600/zip > "$RUNNER_TEMP/fingerprint-reader/original.zip"
      - name: Read and restore every uploaded byte and mode
        run: timeout --signal=KILL 180 python3 -I -B "$RUNNER_TEMP/fingerprint-reader/source/restore.py" --archive "$RUNNER_TEMP/fingerprint-reader/original.zip" --output "$RUNNER_TEMP/fingerprint-reader/restored"
      - name: Complete whole semantic and physical readback with zero native or Rust execution
        run: |
          timeout --signal=KILL 180 python3 -I -B "$RUNNER_TEMP/fingerprint-reader/source/run_reader.py" --prior "$RUNNER_TEMP/fingerprint-reader/restored/prior" --output "$RUNNER_TEMP/fingerprint-reader/output" > "$RUNNER_TEMP/fingerprint-reader/reader.stdout" 2> "$RUNNER_TEMP/fingerprint-reader/reader.stderr"
          cat "$RUNNER_TEMP/fingerprint-reader/reader.stdout"
      - name: Keep any actual failure
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/fingerprint-reader/reader.stderr"; then cat "$RUNNER_TEMP/fingerprint-reader/reader.stderr"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespace-fingerprint-reader-v2
          path: |
            ${{ runner.temp }}/fingerprint-reader/output
            ${{ runner.temp }}/fingerprint-reader/source
            ${{ runner.temp }}/fingerprint-reader/*.stdout
            ${{ runner.temp }}/fingerprint-reader/*.stderr
            ${{ runner.temp }}/fingerprint-reader/restored/RESTORE.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
