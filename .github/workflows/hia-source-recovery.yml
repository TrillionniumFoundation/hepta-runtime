name: HIA scope seed replay
on:
  push:
    branches: ['recovery/hia-bd947-20261114']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact scope candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            native
            scripts
            src
            tests/hia_native
            .github
      - name: Download exact failed-run binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api /repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14119238060/zip > "$RUNNER_TEMP/scope-seed-source.zip"
      - name: Replay all native and original scope cases
        run: python3 -I -B .github/scripts/scope-seed-replay.py
      - name: Preserve complete observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scope-seed-replay-${{ github.sha }}
          path: ${{ runner.temp }}/scope-seed-replay
          retention-days: 14
          if-no-files-found: error
