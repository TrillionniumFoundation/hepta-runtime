name: HIA source recovery
on:
  push:
    branches: ['recovery/hia-bd947-20261114']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read pinned runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/hepta-runtime
          ref: be1b871ce482fec97e65664866731c0b145e79c3
          path: runtime
          persist-credentials: false
      - name: Verify and export runtime in bounded parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          test "$(git -C runtime rev-parse HEAD)" = "be1b871ce482fec97e65664866731c0b145e79c3"
          test "$(git -C runtime rev-parse 'HEAD^{tree}')" = "d82430fed6d100184dae83d74cbe749116523ada"
          test -z "$(git -C runtime status --porcelain)"
          if git -C runtime config --local --name-only --list | grep -Ei 'extraheader|credential|includeif'; then exit 1; fi
          tar -czf export/runtime.tar.gz runtime
          split -b 300M -d -a 2 export/runtime.tar.gz export/runtime.tar.gz.part
          test "$(find export -name 'runtime.tar.gz.part*' | wc -l)" = 3
          (cd export && sha256sum runtime.tar.gz runtime.tar.gz.part* > RUNTIME_SHA256SUMS)
      - name: Upload runtime part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-runtime-part00-bd947
          path: export/runtime.tar.gz.part00
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload runtime part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-runtime-part01-bd947
          path: export/runtime.tar.gz.part01
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload runtime part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-runtime-part02-bd947
          path: export/runtime.tar.gz.part02
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload runtime checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-runtime-checksums-bd947
          path: export/RUNTIME_SHA256SUMS
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
