name: HIA native helper contract

on:
  push:
    branches:
      - 'codex/hia-native-helper-runtime-*'
      - 'codex/hia-three-loop-*'
  pull_request:
    paths:
      - 'src/mcp/hia_*'
      - '.github/workflows/hia-native-helper-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  hia-helper-contract:
    name: Exact-source HIA provider and catalog controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Retain original source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-helper-contract"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/hia-helper-contract/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/hia-helper-contract/source-tree.txt"

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt --toolchain 1.95.0
          rustup default 1.95.0
          rustc --version > "$RUNNER_TEMP/hia-helper-contract/rustc.txt"
          cargo --version > "$RUNNER_TEMP/hia-helper-contract/cargo.txt"

      - name: Check original source formatting
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/hia-helper-contract/format.log"

      - name: HIA provider and schema controls with all features
        run: |
          set -euo pipefail
          cargo test --locked --all-features hia_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/hia-helper-contract/all-features.log"

      - name: HIA provider and schema controls without remote filesystem
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features hia_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/hia-helper-contract/no-default-features.log"

      - name: Confirm tested source remains unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/hia-helper-contract/source-commit.txt")"
          printf '%s\n' 'Provider and catalog controls only; native worker lifecycle qualification is separate.' > "$RUNNER_TEMP/hia-helper-contract/scope.txt"

      - name: Retain original logs and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hia-helper-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-helper-contract/
          if-no-files-found: error
          retention-days: 14
