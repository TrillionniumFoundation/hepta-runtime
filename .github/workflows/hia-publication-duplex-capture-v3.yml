name: 'Actual repaired publication public lifecycles: complete22 inputs'
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-duplex-capture-6780-v3-20261117']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: legacy-a
            first: 0
            count: 6
          - label: legacy-b
            first: 6
            count: 5
          - label: modern-a
            first: 11
            count: 6
          - label: modern-b
            first: 17
            count: 5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set exact runner paths
        run: |
          printf '%s\n' "PC_SOURCE=$GITHUB_WORKSPACE/candidate/tests/hia_native/publication_duplex_capture_v3" "PC_BUILD=$GITHUB_WORKSPACE/build-recipe/tests/hia_native/publication_duplex_build_v3" "PC_PREP=$RUNNER_TEMP/publication-duplex-prepared" "PC_CAPTURE=$RUNNER_TEMP/publication-duplex-observed" "PC_DRIVER=$RUNNER_TEMP/publication-duplex-driver" "PC_EXPORT=$RUNNER_TEMP/publication-duplex-export" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_duplex_capture_v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-recipe
          ref: f4a348f6661aec513ac63e1807ff697e81704b3e
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_duplex_build_v3
      - name: Full source and uploaded graph/original admission
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PC_SOURCE/prepare.py" --build-recipe "$PC_BUILD" --output "$PC_PREP" > "$PC_DRIVER.prepare.stdout" 2> "$PC_DRIVER.prepare.stderr"
          cat "$PC_DRIVER.prepare.stdout"
      - name: Actual unchanged public inputs on the exact successor
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PC_SOURCE/run.py" --prepared "$PC_PREP" --output "$PC_CAPTURE" --first '${{ matrix.first }}' --count '${{ matrix.count }}' > "$PC_DRIVER.stdout" 2> "$PC_DRIVER.stderr"
          cat "$PC_DRIVER.stdout"
      - name: Complete exact wire and full stable state against retained original
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$PC_SOURCE/read_new.py" --prepared "$PC_PREP" --capture "$PC_CAPTURE" > "$PC_CAPTURE/read.stdout" 2> "$PC_CAPTURE/read.stderr"
          cat "$PC_CAPTURE/read.stdout"
      - name: Retain full new success or failure
        if: always()
        run: |
          python3 -I -S -B -c 'import os,pathlib,shutil; r=pathlib.Path(os.environ["PC_CAPTURE"]); r.mkdir(exist_ok=True); p=r/"prepare-records"; p.mkdir(); s=pathlib.Path(os.environ["PC_PREP"]); [shutil.copy2(x,p/x.name) for x in s.glob("*") if x.is_file()]; [shutil.copy2(pathlib.Path(os.environ["PC_DRIVER"]+v),p/("driver"+v)) for v in (".prepare.stdout",".prepare.stderr") if pathlib.Path(os.environ["PC_DRIVER"]+v).exists()]'
          python3 -I -S -B "$PC_SOURCE/archive.py" pack --source "$PC_SOURCE" --capture "$PC_CAPTURE" --output "$PC_EXPORT" --driver-prefix "$PC_DRIVER"
          python3 -I -S -B -c 'import os,pathlib; [print(p.read_text()) for p in (pathlib.Path(os.environ["PC_DRIVER"]+".prepare.stderr"),pathlib.Path(os.environ["PC_DRIVER"]+".stderr"),pathlib.Path(os.environ["PC_CAPTURE"])/"read.stderr") if p.exists()]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-duplex-capture-v3-${{ matrix.label }}-${{ github.sha }}
          path: ${{ env.PC_EXPORT }}
          compression-level: 0
          if-no-files-found: error
