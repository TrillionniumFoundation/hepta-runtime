name: Prepare audit archive-anchor publication sources
on:
  workflow_dispatch:
  push:
    branches: [hia-audit-anchor-publish-source-6780-20261117]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          persist-credentials: false
          sparse-checkout: tests/hia_native/audit_anchor_publish_author
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          path: compiler
          persist-credentials: false
      - name: Admit the complete new source and original spans
        run: |
          export ANCHOR_PREP_ROOT="$RUNNER_TEMP/audit-anchor-publish-source"
          printf 'ANCHOR_PREP_ROOT=%s\n' "$ANCHOR_PREP_ROOT" >> "$GITHUB_ENV"
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
          python3 -I -B - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path(os.environ["ANCHOR_PREP_ROOT"])
          root.mkdir(exist_ok=False)
          shutil.copytree("runtime/tests/hia_native/audit_anchor_publish_author",root/"source")
          raw=(root/"source/SOURCE.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="a93d64211a565b20451ac8efec21ade36c312716e91c59d67ad2071c5daab9ae"
          PY
          timeout --signal=KILL 60 python3 -I -B "$ANCHOR_PREP_ROOT/source/source_check.py" > "$ANCHOR_PREP_ROOT/source-check.json"
          cat "$ANCHOR_PREP_ROOT/source-check.json"
      - name: Fresh source authoring and HIA compilation with no owner semantic calls
        run: |
          python3 -I -B "$ANCHOR_PREP_ROOT/source/prepare.py" \
            --hepta "$GITHUB_WORKSPACE/compiler" --output "$ANCHOR_PREP_ROOT/capture" \
            > "$ANCHOR_PREP_ROOT/prepare.stdout" 2> "$ANCHOR_PREP_ROOT/prepare.stderr"
          cat "$ANCHOR_PREP_ROOT/capture/processes/author-owner.stdout"
          cat "$ANCHOR_PREP_ROOT/capture/processes/author-callable.stdout"
          cat "$ANCHOR_PREP_ROOT/prepare.stdout"
      - name: Keep and reread all successful or failed source/build evidence
        if: always()
        run: |
          if test -f "$ANCHOR_PREP_ROOT/source/export_prepare.py"; then
            python3 -I -B "$ANCHOR_PREP_ROOT/source/export_prepare.py" \
              --root "$ANCHOR_PREP_ROOT" --archive "$RUNNER_TEMP/audit-anchor-publish-source.tar.gz"
          fi
      - name: Upload complete preparation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-anchor-publish-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/audit-anchor-publish-source.tar.gz
            ${{ runner.temp }}/audit-anchor-publish-source.tar.gz.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
