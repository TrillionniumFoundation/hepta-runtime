name: Export exact installed102 complete Authority bytes
on:
  push:
    branches: [hia-installed102-byte-export-6780-20261116]
    paths: ['.github/workflows/hia-installed102-evidence-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover the exact existing original artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14245834839 > "$RUNNER_TEMP/original-artifact.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14245834839/zip > "$RUNNER_TEMP/original-artifact.zip"
      - name: Verify and split all original bytes without semantic execution
        run: |
          python3 -I -S -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path(os.environ['RUNNER_TEMP']);archive=root/'original-artifact.zip'
          metadata=json.loads((root/'original-artifact.json').read_bytes())
          digest='0ff7728c82ce7387b329a22f941bf8144b21ce3a83e2ffcce0c5dcf802daab0f'
          assert metadata['id']==14245834839 and metadata['workflow_run']['id']==43907235050
          assert metadata['workflow_run']['head_sha']=='0a8f9d6603abaf85f702ff2626dbe75f5d5f841c'
          assert metadata['size_in_bytes']==archive.stat().st_size==559811102
          assert metadata['digest']=='sha256:'+digest and metadata['expired'] is False
          with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
          destination=root/'complete-parts';destination.mkdir();parts=[];offset=0
          with archive.open('rb') as source:
              for index in range(3):
                  raw=source.read(256<<20);assert raw
                  folder=destination/str(index);folder.mkdir();(folder/'part.bin').write_bytes(raw)
                  parts.append(dict(index=index,offset=offset,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()));offset+=len(raw)
              assert source.read(1)==b'' and offset==559811102
          record=dict(schema='hepta.complete-original-artifact-zip-parts.v1',original_run=43907235050,
              original_job=133439239073,original_artifact=14245834839,
              original_head='0a8f9d6603abaf85f702ff2626dbe75f5d5f841c',
              original_zip=dict(bytes=559811102,sha256=digest),parts=parts,
              semantic_executions=0,original_failure_reclassified_as_pass=False,source_or_evidence_modified=False)
          for row in parts:
              folder=destination/str(row['index'])
              (folder/'parts.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
              shutil.copyfile(root/'original-artifact.json',folder/'original-artifact.json')
          print(json.dumps(record,sort_keys=True))
          PY
      - name: Retain first complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed102-authority-complete-part-0
          path: ${{ runner.temp }}/complete-parts/0/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain second complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed102-authority-complete-part-1
          path: ${{ runner.temp }}/complete-parts/1/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain final complete byte range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed102-authority-complete-part-2
          path: ${{ runner.temp }}/complete-parts/2/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

