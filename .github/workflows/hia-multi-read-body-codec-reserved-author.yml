name: Author exact multi-read codec reserved-word correction
on:
  workflow_dispatch:
  push:
    branches: [hia-multi-read-body-codec-reserved-6780-20261117]
permissions:
  contents: read
jobs:
  source-author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      MULTI_BODY_SOURCE: ${{ github.workspace }}/runtime/qualification/multi_read_body/v1/codec_reserved_author
      MULTI_BODY_MANIFEST: 368a75d3f84857695553c361978ed28c6bac3ff29dcd2e9d46426e7709cb8ee2
    steps:
      - name: Checkout frozen source author
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/multi_read_body/v1/codec_reserved_author
          persist-credentials: false
      - name: Checkout exact HIA source tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Verify exact source heads
        run: |
          test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C compiler rev-parse HEAD)" = d3e2c90173cf733e42b299d0c4274df4b593a12f
          test "$(git -C compiler rev-parse 'HEAD^{tree}')" = 8d8b0fb8d015fb7edab302498bb9ed4c74ab6f49
      - name: Author exact HIA without compiling or executing a native module
        run: |
          python3 -I -B "$MULTI_BODY_SOURCE/authoring/freeze_driver.py" \
            --source "$MULTI_BODY_SOURCE" --hepta "$GITHUB_WORKSPACE/compiler" \
            --output "$RUNNER_TEMP/multi-read-body-codec-reserved-authored" --manifest-sha256 "$MULTI_BODY_MANIFEST"
      - name: Preserve all generated sources and process streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multi-read-body-codec-reserved-author-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multi-read-body-codec-reserved-authored
          if-no-files-found: error
          retention-days: 14
