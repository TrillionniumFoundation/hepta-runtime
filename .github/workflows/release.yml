name: Private release validation

# This fork does not publish upstream packages or inherit upstream secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locked Linux runtime and root-helper build
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --locked --all-targets
          python3 tests/file_capabilities.py
          cargo +1.95.0 build --locked --release
          sha256sum target/release/hepta-runtime target/release/hepta-runtime-jobctl
