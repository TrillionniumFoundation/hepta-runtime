name: Private release validation

# This fork does not publish upstream packages or inherit upstream secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Locked Linux runtime and root-helper build
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --locked --all-targets
          python3 tests/file_capabilities.py
          cargo +1.95.0 build --locked --release
          sha256sum target/release/hepta-runtime target/release/hepta-runtime-jobctl

      - name: Package source-bound private release
        env:
          HEPTA_RELEASE_OUTPUT: ${{ runner.temp }}/hepta-runtime-release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile

          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ["HEPTA_RELEASE_OUTPUT"])
          bundle = output / "bundle"
          bundle.mkdir(parents=True)
          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(
              ["git", "diff", "--quiet", "HEAD", "--",
               "Cargo.toml", "Cargo.lock", "src", "deploy"], check=True)

          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          files = {}
          def stage(relative_source, relative_target):
              source = root / relative_source
              target = bundle / relative_target
              if source.is_symlink() or not source.is_file():
                  raise RuntimeError("Release input is not a regular file: " + relative_source)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              files[relative_target] = {
                  "sha256": sha256(target),
                  "bytes": target.stat().st_size,
                  "mode": format(target.stat().st_mode & 0o777, "04o"),
              }

          for name in ("hepta-runtime", "hepta-runtime-jobctl"):
              stage("target/release/" + name, "bin/" + name)
          deploy_paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "deploy"]).split(b"\0")
          for raw_path in deploy_paths:
              if raw_path:
                  path = os.fsdecode(raw_path)
                  stage(path, path)
          manifest = {
              "schema": "hepta-runtime-release-manifest-v1",
              "source_commit": source_commit,
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "cargo_lock_sha256": sha256(root / "Cargo.lock"),
              "rustc_version": subprocess.check_output(
                  ["rustc", "+1.95.0", "-vV"], text=True).strip(),
              "cargo_version": subprocess.check_output(
                  ["cargo", "+1.95.0", "--version"], text=True).strip(),
              "build_command": "cargo +1.95.0 build --locked --release",
              "files": files,
          }
          manifest_path = bundle / "manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          shutil.copy2(manifest_path, output / "manifest.json")
          # A tar archive preserves executable bits that an artifact ZIP does not.
          with tarfile.open(output / "hepta-runtime-release.tar.gz", "w:gz") as archive:
              archive.add(bundle, arcname="hepta-runtime")
          PY

      - name: Retain private release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-runtime-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-runtime-release/hepta-runtime-release.tar.gz
            ${{ runner.temp }}/hepta-runtime-release/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
