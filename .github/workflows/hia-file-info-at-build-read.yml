name: Independently read uploaded complete file_info native build
on:
  workflow_dispatch:
  push:
    branches: [hia-file-info-at-build-read-6780-20261117]
permissions:
  contents: read
  actions: read
jobs:
  retained-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      INFO_SOURCE: ${{ github.workspace }}/qualification/file_info_at/v1/build_uploaded_read
      INFO_MANIFEST: 7cc9205dc6283b294d302b75bf68a3a4a3eadc12eb2c26c1d27235cb33156dd4
    steps:
      - name: Checkout exact source-owned reader and complete trusted build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: qualification/file_info_at/v1/build_uploaded_read
          persist-credentials: false
      - name: Read all uploaded archive bytes and seven retained guards without replay
        run: |
          python3 -I -S -B "$INFO_SOURCE/scripts/driver.py" read \
            --work "$RUNNER_TEMP/info-build-uploaded-read" --source-manifest-sha256 "$INFO_MANIFEST"
      - name: Archive the complete reader evidence and original immutable capture
        if: always()
        run: |
          python3 -I -S -B "$INFO_SOURCE/scripts/driver.py" export \
            --work "$RUNNER_TEMP/info-build-uploaded-read" --output "$RUNNER_TEMP/info-build-uploaded-read-export" \
            --source-manifest-sha256 "$INFO_MANIFEST"
      - name: Upload complete independent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: info-build-uploaded-read-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/info-build-uploaded-read-export
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
