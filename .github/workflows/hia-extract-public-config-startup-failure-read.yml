name: Pure full configured catalog startup failure read
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-public-6780-20261116']
    paths: ['tests/hia_native/public118_config_startup_failure_read_ci/**', '.github/workflows/hia-extract-public-config-startup-failure-read.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  LC_ALL: C.UTF-8
jobs:
  retained-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {domain: catalog-legacy, artifact: 14305638760}
          - {domain: catalog-modern, artifact: 14306860001}
    steps:
      - name: Checkout frozen complete archive readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public118_config_startup_failure_read_ci
      - name: Download the same failed semantic capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/extract-custom-public-read-input"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/${{ matrix.artifact }}' > "$RUNNER_TEMP/extract-custom-public-read-input/artifact.json"
          gh api 'repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/${{ matrix.artifact }}/zip' > "$RUNNER_TEMP/extract-custom-public-read-input/complete.zip"
      - name: Reopen all input, output, state, filesystem and source bytes without execution
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/source/tests/hia_native/public118_config_startup_failure_read_ci/run.py" --input "$RUNNER_TEMP/extract-custom-public-read-input/complete.zip" --output "$RUNNER_TEMP/extract-catalog-failure-read" --domain '${{ matrix.domain }}' --profile 'ae8b7258ce000d5bd1fd8a1a4e07e6bbc3c3e62990ac43a8dd6f014d439b7421'
      - name: Upload complete independent reader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extract-config-startup-failure-complete-read-${{ matrix.domain }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extract-catalog-failure-read/proof
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
