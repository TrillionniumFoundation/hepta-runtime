name: Qualify HIA Python JSON object items
on:
  workflow_dispatch:
  push:
    branches: [hia-python-json-items-actual-v1-6780-20261118]
permissions:
  contents: read
  actions: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3]
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      PYJSON_SOURCE: ${{ github.workspace }}/runtime/qualification/python_json_items/v1/actual_source
      PYJSON_MANIFEST: 0c1d3eb5a8e2348e13723a2a1bbf9ad8d5aaa41d981158ef3198c5bf56296363
    steps:
      - name: Checkout complete frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          sparse-checkout: qualification/python_json_items/v1/actual_source
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git -C runtime rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Capture each original and HIA case once
        run: |
          python3 -I -S -B "$PYJSON_SOURCE/scripts/gate.py" run \
            --work "$RUNNER_TEMP/python-json-items-actual" --shard "${{ matrix.shard }}" \
            --source-manifest-sha256 "$PYJSON_MANIFEST"
      - name: Preserve complete captures including failures
        if: always()
        run: |
          python3 -I -S -B "$PYJSON_SOURCE/scripts/gate.py" export \
            --work "$RUNNER_TEMP/python-json-items-actual" --shard "${{ matrix.shard }}" \
            --output "$RUNNER_TEMP/python-json-items-export" --source-manifest-sha256 "$PYJSON_MANIFEST"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-json-items-actual-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-json-items-export
          if-no-files-found: error
          retention-days: 14
