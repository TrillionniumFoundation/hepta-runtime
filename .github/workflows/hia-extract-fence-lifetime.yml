name: Link request-owned filesystem fence successor from exact retained HIA
on:
  workflow_dispatch:
  push:
    branches: ['hia-extract-fence-lifetime-6780-20261117']
    paths: ['tests/hia_native/public123_extract_fence_lifetime_ci/**', '.github/workflows/hia-extract-fence-lifetime.yml']
permissions:
  contents: read
  actions: read
env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set fixed evidence locations
        run: |
          printf '%s\n' "FENCE_PACKAGE=$GITHUB_WORKSPACE/runtime/tests/hia_native/public123_extract_fence_lifetime_ci" "FENCE_CAPTURE=$RUNNER_TEMP/extract-fence-build" "FENCE_INPUTS=$RUNNER_TEMP/extract-fence-inputs" "FENCE_EXPORT=$RUNNER_TEMP/extract-fence-export" "FENCE_DRIVER=$RUNNER_TEMP/extract-fence-driver" >> "$GITHUB_ENV"
      - name: Checkout exact frozen successor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/public123_extract_fence_lifetime_ci
      - name: Checkout original complete Local-repair build reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-source
          ref: eceaaa36f5b92b64d83807f9d2605f744c652e80
          persist-credentials: false
          sparse-checkout: tests/hia_native/public123_extract_local_policy_ci
      - name: Checkout exact pure restoration entry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: native-source
          ref: 42cccdc859b494d300f8756227b19c91009a0a72
          persist-credentials: false
          sparse-checkout: tests/hia_native/public123_extract_wait_fixed_native_ci
      - name: Checkout exact archive helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: capture-source
          ref: 61e3a24e8d01aed2c912873039882bd99b248436
          persist-credentials: false
          sparse-checkout: tests/hia_native/public123_extract_contention_ci
      - name: Checkout exact compiler source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/Hepta
          path: compiler
          ref: d3e2c90173cf733e42b299d0c4274df4b593a12f
          persist-credentials: false
      - name: Complete source and syntax admission
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse HEAD)" = '${{ github.sha }}'
          test "$(sha256sum "$FENCE_PACKAGE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = '5463a69dab6d8dcfab7347c9eea6584bc7f214c5906f5800c427fbd59f29e492'
          test "$(sha256sum "$GITHUB_WORKSPACE/native-source/tests/hia_native/public123_extract_wait_fixed_native_ci/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = '20a7176393a2f72c7e01b64aa54a82aa5a3df50831451fd5fa42b77202a61276'
          python3 -I -S -B "$FENCE_PACKAGE/check_source.py"
      - name: Independently reread both complete retained graph captures without applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -I -S -B "$GITHUB_WORKSPACE/native-source/tests/hia_native/public123_extract_wait_fixed_native_ci/restore_native.py" --build-source "$GITHUB_WORKSPACE/build-source/tests/hia_native/public123_extract_local_policy_ci" --capture-source "$GITHUB_WORKSPACE/capture-source/tests/hia_native/public123_extract_contention_ci" --output "$FENCE_INPUTS" > "$FENCE_DRIVER.stdout" 2> "$FENCE_DRIVER.stderr"
          fence_status=$?
          cat "$FENCE_DRIVER.stderr"
          exit "$fence_status"
      - name: Reverify all115 retained owners and link two fresh entries with the same actual B3
        run: |
          set +e
          python3 -I -S -B "$FENCE_PACKAGE/build.py" --output "$FENCE_CAPTURE" --inputs "$FENCE_INPUTS" --hepta "$GITHUB_WORKSPACE/compiler" >> "$FENCE_DRIVER.stdout" 2>> "$FENCE_DRIVER.stderr"
          fence_status=$?
          cat "$FENCE_DRIVER.stderr"
          test "$fence_status" -ne 0 || cat "$FENCE_DRIVER.stdout"
          exit "$fence_status"
      - name: Six physical refusals and one whole relocation under unchanged read-only guards
        run: |
          python3 -I -S -B "$FENCE_PACKAGE/controls.py" --retained "$FENCE_INPUTS/shared/retained" --previous "$FENCE_INPUTS/successor/capture" --fixture "$FENCE_CAPTURE" --output "$FENCE_CAPTURE-reader-controls"
      - name: Preserve complete build and source on success or failure
        if: always()
        run: |
          python3 -I -S -B "$FENCE_PACKAGE/archive.py" pack --source "$FENCE_PACKAGE" --capture "$FENCE_CAPTURE" --output "$FENCE_EXPORT" --driver-prefix "$FENCE_DRIVER"
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extract-fence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.FENCE_EXPORT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
