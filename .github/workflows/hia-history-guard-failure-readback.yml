name: Independently read retained historical control failure
on:
  push:
    branches: [hia-history-aggregate-readback-6780-20261117]
    paths: ['.github/workflows/hia-history-guard-failure-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen pure readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            qualification/history_aggregate_recovery/independent-readback-v8
      - name: Verify all frozen reader bytes
        run: |
          echo "c13bf4a488f6c61131ee7dfa015b9b80cd4df932020c4c19b84a7d7e9635123f  qualification/history_aggregate_recovery/independent-readback-v8/read_proof_archive_v2.py" | sha256sum --check --strict
          echo "4c738d354e7e2f3ada427359ac8f54652ce21f8f5ee399464a9fc00dc34e7c47  qualification/history_aggregate_recovery/independent-readback-v8/inspect_skipped_failure_v11.py" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/history-guard-readback/logs"
      - name: Download the exact retained failed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14298019630 > "$RUNNER_TEMP/history-guard-readback/artifact-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14298019630/zip > "$RUNNER_TEMP/history-guard-readback/failed-input.zip"
      - name: Read the complete original index and exact failed report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "9eb6cefbcb86fcf59508a34db6fe152f0c98a124e0a1897e57127a4786e922f5  qualification/history_aggregate_recovery/independent-readback-v8/read_original_index.py" | sha256sum --check --strict
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14276342887 > "$RUNNER_TEMP/history-guard-readback/original-index-metadata.json"
          gh api repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/14276342887/zip > "$RUNNER_TEMP/history-guard-readback/original-index.zip"
          timeout --signal=KILL 900 python3 -I -S -B qualification/history_aggregate_recovery/independent-readback-v8/read_original_index.py --zip "$RUNNER_TEMP/history-guard-readback/original-index.zip" --output "$RUNNER_TEMP/history-original-index" > "$RUNNER_TEMP/history-guard-readback/logs/original-index.stdout" 2> "$RUNNER_TEMP/history-guard-readback/logs/original-index.stderr"
      - name: Independently reopen every ZIP TAR source and proof byte
        run: |
          timeout --signal=KILL 900 python3 -I -S -B             qualification/history_aggregate_recovery/independent-readback-v8/read_proof_archive_v2.py             --zip "$RUNNER_TEMP/history-guard-readback/failed-input.zip"             --zip-bytes 60667950 --zip-sha256 92f1a5e72db1e982b2b237084b4423aaa1204f045e5050960626f54ef5533798             --source-manifest-sha256 ef304f1000a49279bf1f51c8088ee27220e145c6564c020a2abd3116e7ea3b32             --output "$RUNNER_TEMP/history-guard-extracted"             > "$RUNNER_TEMP/history-guard-readback/logs/archive.stdout"             2> "$RUNNER_TEMP/history-guard-readback/logs/archive.stderr"
          cp "$RUNNER_TEMP/history-guard-extracted/COMPLETE_READBACK.json" "$RUNNER_TEMP/history-guard-readback/COMPLETE_READBACK.json"
          cp "$RUNNER_TEMP/history-guard-extracted/COMPLETE_MEMBER_PINS.json" "$RUNNER_TEMP/history-guard-readback/COMPLETE_MEMBER_PINS.json"
      - name: Bind complete successful aggregate and actual skipped-control failure
        run: |
          timeout --signal=KILL 180 python3 -I -S -B             qualification/history_aggregate_recovery/independent-readback-v8/inspect_skipped_failure_v11.py             --readback "$RUNNER_TEMP/history-guard-extracted"             --original-report "$RUNNER_TEMP/history-original-index/original-result.json"             --output "$RUNNER_TEMP/history-guard-readback/SKIPPED_FAILURE_REVIEW.json"             > "$RUNNER_TEMP/history-guard-readback/logs/inspection.stdout"             2> "$RUNNER_TEMP/history-guard-readback/logs/inspection.stderr"
      - name: Preserve complete diagnostic output
        if: always()
        run: |
          for stream in original-index.stdout original-index.stderr archive.stdout archive.stderr inspection.stdout inspection.stderr; do
            if test -f "$RUNNER_TEMP/history-guard-readback/logs/$stream"; then
              cat "$RUNNER_TEMP/history-guard-readback/logs/$stream"
            fi
          done
      - name: Retain exact input ZIP and full independent proof including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-guard-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-guard-readback/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
