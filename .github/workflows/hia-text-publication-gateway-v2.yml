name: Configured text publication gateway development
on:
  workflow_dispatch:
  push:
    branches: ['hia-text-publication-gateway-6780-v2-20261117']
    paths: ['tests/hia_native/text_publication_gateway_ci/**', '.github/workflows/hia-text-publication-gateway-v2.yml']
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C.UTF-8
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "TP_PACKAGE=$GITHUB_WORKSPACE/candidate/tests/hia_native/text_publication_gateway_ci/source" "TP_OUTPUT=$RUNNER_TEMP/text-publication-gateway" "TP_EXPORT=$RUNNER_TEMP/text-publication-gateway-export" "TP_DRIVER=$RUNNER_TEMP/text-publication-gateway-driver" >> "$GITHUB_ENV"
      - name: Checkout exact frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/text_publication_gateway_ci/source
      - name: Verify all source and exact original fragments
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "${{ github.sha }}"
          test "$(sha256sum "$TP_PACKAGE/SOURCE_MANIFEST.json" | cut -d' ' -f1)" = 833bf7eb435f032cf39c4fbf133bb8d721ac2cf745b0fd8632e80389f1fd2039
          python3 -I -S -B "$TP_PACKAGE/recipe/check_source.py" --source "$TP_PACKAGE"
      - name: Read complete failed artifact and exact original/native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B "$TP_PACKAGE/recipe/fetch_graph.py" --output "$TP_OUTPUT/frozen-graph"
      - name: Complete five admitted profiles and reread the retained absent profile
        run: |
          set +e
          python3 -I -S -B "$TP_PACKAGE/recipe/run_profiles.py" --source "$TP_PACKAGE" --dependencies "$TP_OUTPUT/frozen-graph/DEPENDENCIES.json" --original-build "$TP_OUTPUT/frozen-graph/extracted/capture/original-build" --output "$TP_OUTPUT/profiles" > "$TP_DRIVER.stdout" 2> "$TP_DRIVER.stderr"
          tp_status=$?
          cat "$TP_DRIVER.stdout"
          cat "$TP_DRIVER.stderr"
          exit "$tp_status"
      - name: Preserve complete source, native, original and failures
        if: always()
        run: |
          python3 -I -S -B "$TP_PACKAGE/recipe/archive.py" pack --source "$TP_PACKAGE" --capture "$TP_OUTPUT" --output "$TP_EXPORT" --driver-prefix "$TP_DRIVER"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: text-publication-gateway-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.TP_EXPORT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
