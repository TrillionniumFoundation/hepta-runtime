name: Repository Hygiene

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'archives/**'
      - 'docs/qualification/**'
      - 'docs/rea-native/compatibility/**'
      - 'scripts/*verify_rust_consolidation.py'
      - 'deploy/dc_replacement_gate.py'
      - 'tests/**'
      - 'deploy/chatgpt_mcp_bridge.py'
      - 'deploy/readonly-bridge/**'
      - 'deploy/dc_compat/gnome_window_install.py'
      - 'deploy/dc_compat/gnome_window_extension/**'
      - 'LICENSE'
      - 'tools/x230/**'
      - 'Cargo.toml'
      - '.github/workflows/repository-hygiene.yml'
  pull_request:
    paths:
      - 'archives/**'
      - 'docs/qualification/**'
      - 'docs/rea-native/compatibility/**'
      - 'scripts/*verify_rust_consolidation.py'
      - 'deploy/dc_replacement_gate.py'
      - 'tests/**'
      - 'deploy/chatgpt_mcp_bridge.py'
      - 'deploy/readonly-bridge/**'
      - 'deploy/dc_compat/gnome_window_install.py'
      - 'deploy/dc_compat/gnome_window_extension/**'
      - 'LICENSE'
      - 'tools/x230/**'
      - 'Cargo.toml'
      - '.github/workflows/repository-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source and retained history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify complete historical source custody
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts -p 'test_verify_rust_consolidation.py' -v
          python3 -B scripts/verify_rust_consolidation.py | tee "$RUNNER_TEMP/archive-custody.json"
      - name: Both bridge entry points and standalone deployment
        run: |
          set -euo pipefail
          python3 -B tests/chatgpt_bridge_tests.py -v
          python3 -B tests/chatgpt_bridge_stdio_tests.py -v
          python3 -B tests/chatgpt_bridge_http_tests.py -v
      - name: GNOME extension package and private config
        run: python3 -B tests/dc_compat_gnome_window_tests.py PackagingTests -v
      - name: Retained X230 qualification harnesses
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools/x230/20261028 -p '*_tests.py' -v
          python3 -B -m unittest discover -s tools/x230/20261029 -p '*_tests.py' -v
          python3 -B -m unittest discover -s tools/x230/20261030 -p '*_tests.py' -v
      - name: Install qualification schema dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-jsonschema
      - name: Retained REA evidence consumers
        run: |
          set -euo pipefail
          python3 -B scripts/rea_compatibility_ledger.py check-mapping
          python3 -B -m unittest discover -s tests -p 'rea_*tests.py' -v
      - name: Retained DC evidence consumers
        run: |
          set -euo pipefail
          python3 -B tests/dc_model_origin_ledger_tests.py
          python3 -B tests/model_origin_tool_ledger_tests.py
          python3 -B tests/dc_replacement_gate_tests.py
      - name: Retained successor source contracts
        run: |
          set -euo pipefail
          # Preserve the reviewed pins from operator-parity; never derive an
          # expected digest from the candidate being checked.
          for suite in signal_fixture health_multiread; do
            python3 -B "tests/dc_functional_v9_${suite}_safety_tests.py" \
              --expected-signal-harness-sha256 9c19eace90ac21ae70949e7f3718500f44a07f19edbf47350d398cef80c0858a \
              --expected-health-harness-sha256 6cd20cc16d3982150e0dca549ed4e1440409798bf60e218145b053addd785c77 \
              --expected-version-helper-sha256 ac6dbe8a29c9a1e1d31712f4862d3895962bd92e3dbf5d805bee15b5466b7059 \
              --expected-loader-sha256 0b039e2d667314fec32bde7827fd0f9ad01d35b8d3199e73a1e036c7b1eb3dde \
              --expected-tool-helper-sha256 e2b29f987d3aaa863d7bf6879d0d6a835a807c133c5c355b6a4e69bce9c3e216 \
              --expected-http-helper-sha256 8b7ee206ccfc7978ac4abdf3eac3ddb8f7e7c36d053f601b5cfcb66f52fb8dba
          done
          python3 -B tests/dc_functional_v10_contract_approval_tests.py
      - name: Install pinned Cargo
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check package source closure and retired paths
        run: |
          set -euo pipefail
          cargo +1.95.0 package --list > "$RUNNER_TEMP/cargo-package-files.txt"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          paths = (Path(os.environ['RUNNER_TEMP']) / 'cargo-package-files.txt').read_text().splitlines()
          manifests = sorted(Path('archives/repository-history').glob('*.json'))
          inventories = [json.loads(manifest.read_text()) for manifest in manifests]
          retired_roots = tuple(root for inventory in inventories
                                for root in inventory['retired_roots'])
          retired_files = {path for inventory in inventories
                           for path in inventory.get('retired_files', [])}
          if not retired_roots and not retired_files:
              raise SystemExit('Missing repository history inventory')
          unexpected = [p for p in paths if p.startswith(retired_roots) or p in retired_files]
          if unexpected:
              raise SystemExit('Retired package paths: ' + repr(unexpected))
          required = [str(p) for p in Path('src').rglob('*') if p.is_file()]
          missing = sorted(set(required) - set(paths))
          if missing:
              raise SystemExit('Missing runtime package inputs: ' + repr(missing))
          package_bytes = sum(Path(p).stat().st_size for p in paths if Path(p).is_file())
          print(json.dumps({'package_paths': len(paths), 'existing_file_bytes': package_bytes, 'runtime_inputs': len(required)}))
          PYCODE
      - name: Retain source custody report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-hygiene-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/archive-custody.json
            ${{ runner.temp }}/cargo-package-files.txt
          if-no-files-found: warn
