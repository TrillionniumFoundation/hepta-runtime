name: Immutable publication pending failure read
on:
  workflow_dispatch:
  push:
    branches: ['hia-publication-public-probe-read-6780-v1-20261117']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set runtime paths
        run: |
          printf '%s\n' "PR_SOURCE=$GITHUB_WORKSPACE/candidate/tests/hia_native/publication_public_probe_read_ci" "PR_READ=$RUNNER_TEMP/publication-probe-failure-read" "PR_PROOF=$RUNNER_TEMP/publication-probe-failure-proof" "PR_DRIVER=$RUNNER_TEMP/publication-probe-failure-driver" "PR_EXPORT=$RUNNER_TEMP/publication-probe-failure-export" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/hia_native/publication_public_probe_read_ci
      - name: Whole failure archive and complete raw traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B "$PR_SOURCE/read_failure.py" --output "$PR_READ" > "$PR_DRIVER.stdout" 2> "$PR_DRIVER.stderr"
          cat "$PR_DRIVER.stdout"
      - name: Preserve complete proof or reader failure
        if: always()
        run: |
          python3 -I -S -B -c 'import os,pathlib,shutil; r=pathlib.Path(os.environ["PR_READ"]); p=pathlib.Path(os.environ["PR_PROOF"]); p.mkdir(); [(shutil.copyfile(r/n,p/n)) for n in ("READ.json","ARCHIVE.json","FILES.json","READ_ONLY.json","DIAGNOSTIC.json") if (r/n).is_file()]'
          python3 -I -S -B "$PR_SOURCE/build-reference/archive.py" pack --source "$PR_SOURCE" --capture "$PR_PROOF" --output "$PR_EXPORT" --driver-prefix "$PR_DRIVER"
          python3 -I -S -B -c 'import os,pathlib; p=pathlib.Path(os.environ["PR_DRIVER"]+".stderr"); print(p.read_text() if p.exists() else "")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-probe-failure-read-${{ github.sha }}
          path: ${{ env.PR_EXPORT }}
          compression-level: 0
          if-no-files-found: error
