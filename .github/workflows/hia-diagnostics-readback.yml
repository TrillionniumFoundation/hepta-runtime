name: Read complete retained v14 failure diagnostics
on:
  push:
    branches: [hia-diagnostics-readback-6780-20261116]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    name: Retained original ${{ matrix.group }} diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: state
            spec: "{\"group\":\"state\",\"id\":14191965038,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-state\",\"bytes\":960425024,\"sha256\":\"04c7c97409e862be0f2f4560bcf3c154cca884c730ac6c303783c9d60de65083\"}"
          - group: system
            spec: "{\"group\":\"system\",\"id\":14191876112,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-system\",\"bytes\":1095360497,\"sha256\":\"3a02975a996b7241332e9471165a6ddab11b5a4635e5e2cba25f5aad8d6ef489\"}"
          - group: services
            spec: "{\"group\":\"services\",\"id\":14191755625,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-services\",\"bytes\":841946785,\"sha256\":\"41e0da612b8ed320de45c5429043c21174b549468c13dddd7e0eb5a7f394870b\"}"
          - group: storage
            spec: "{\"group\":\"storage\",\"id\":14191586959,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-storage\",\"bytes\":807119113,\"sha256\":\"468840b1691cae6eec13dc66319fbe20cabb213e866c765418131ee5a8f96d15\"}"
          - group: bytes
            spec: "{\"group\":\"bytes\",\"id\":14191487452,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-bytes\",\"bytes\":1309120808,\"sha256\":\"9256486e6ec30bdc271919694f1a2d345bc38a40ff031d830ee7a83dc1d5aa35\"}"
          - group: batch
            spec: "{\"group\":\"batch\",\"id\":14191427610,\"name\":\"hia-original-diagnostics-07a07d41bb452a4357d12b508634a414b29db51a-43783970973-1-batch\",\"bytes\":1199215593,\"sha256\":\"f966b6b6dcaba748a14d10ad9be7419e4b6e065b680f1cd4e1f1963c7bc7de1d\"}"
    steps:
      - name: Independently verify fixed artifact and every complete diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SPEC: ${{ matrix.spec }}
        run: |
          python3 -I -B - <<'PY'
          """Read complete diagnostics from fixed failed CI archives without executing them."""
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, stream, code, message, headers, newurl):
                  return None
          
          
          spec = json.loads(os.environ['ARTIFACT_SPEC'])
          head = '07a07d41bb452a4357d12b508634a414b29db51a'
          api = 'https://api.github.com/repos/TrillionniumFoundation/hepta-runtime/actions/artifacts/' + str(spec['id'])
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=60) as stream:
              actual = json.load(stream)
          assert actual['id'] == spec['id'] and actual['name'] == spec['name']
          assert actual['size_in_bytes'] == spec['bytes']
          assert actual['digest'] == 'sha256:' + spec['sha256']
          assert actual['workflow_run']['id'] == 43783970973
          assert actual['workflow_run']['head_sha'] == head and not actual['expired']
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(api + '/zip', headers=headers), timeout=60)
          except urllib.error.HTTPError as error:
              assert error.code in (301, 302, 303, 307, 308)
              download_url = error.headers['Location']
          else:
              raise AssertionError('GitHub artifact endpoint did not return its signed download location')
          assert urllib.parse.urlparse(download_url).scheme == 'https'
          root = Path(os.environ['RUNNER_TEMP']) / 'retained-diagnostics'
          root.mkdir(mode=0o700)
          archive = root.parent / 'retained-failed-artifact.zip'
          digest = hashlib.sha256()
          size = 0
          # The signed storage request carries no GitHub credential headers.
          with urllib.request.urlopen(download_url, timeout=60) as stream, archive.open('xb') as output:
              while chunk := stream.read(1 << 20):
                  digest.update(chunk)
                  size += len(chunk)
                  output.write(chunk)
          assert size == spec['bytes'] and digest.hexdigest() == spec['sha256']
          files = {}
          with zipfile.ZipFile(archive) as source:
              names = source.namelist()
              assert len(names) == len(set(names))
              for name in names:
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if name.endswith('/') or name == 'failure-evidence.tar':
                      continue
                  # All complete diagnostics are retained, including empty streams.
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  digest = hashlib.sha256()
                  size = 0
                  with source.open(name) as reader, target.open('xb') as writer:
                      while chunk := reader.read(1 << 20):
                          writer.write(chunk)
                          digest.update(chunk)
                          size += len(chunk)
                  assert size == source.getinfo(name).file_size
                  files[name] = {'bytes': size, 'sha256': digest.hexdigest()}
          manifest = json.loads((root / 'manifest.json').read_bytes())
          assert manifest['schema'] == 'hepta.runtime.native-failure-evidence.v1'
          assert manifest['original_failure_reclassified_as_pass'] is False
          for name, row in manifest['diagnostics'].items():
              assert row['destination'] == 'diagnostics/' + name
              if row['copy'] is not None:
                  assert files[row['destination']] == row['copy'], name
          report = json.loads((root / 'diagnostics/result.json').read_bytes())
          summary = {'schema': 'hepta.runtime.failed-diagnostics-readback.v1',
                     'status': 'DIAGNOSTIC_BYTES_VERIFIED', 'artifact': spec,
                     'original_artifact_status': manifest['status'],
                     'diagnostics_complete': manifest['diagnostics_complete'],
                     'original_archive_complete': manifest['archive']['complete'],
                     'original_failure_reclassified_as_pass': False,
                     'original_run_status': report.get('status'), 'original_phase': report.get('phase'),
                     'original_error': report.get('error'),
                     'completed_original_recipes': sorted(report.get('original_rust_comparisons', {})),
                     'original_processes': [{key: row.get(key) for key in
                          ('name', 'phase', 'elapsed_seconds', 'timeout_seconds', 'timed_out',
                           'exit_code', 'start_error', 'stdout_bytes', 'stderr_bytes')}
                          for row in report.get('checks', []) if row.get('phase') == 'original_rust_comparison'],
                     'files': files, 'native_or_rust_executed': False}
          (root / 'READBACK.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print(json.dumps({key: value for key, value in summary.items() if key != 'files'}, sort_keys=True))
          PY
      - name: Preserve complete diagnostics and their original failed status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-v14-original-diagnostics-${{ matrix.group }}
          path: ${{ runner.temp }}/retained-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
